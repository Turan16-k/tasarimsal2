<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 17 — Kristal</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
const perm=new Uint8Array(512);
(function(){const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(rand()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
function val2(x,y){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const u=fade(xf),v=fade(yf);const a=perm[(perm[xi&255]+yi)&255];const b=perm[(perm[(xi+1)&255]+yi)&255];const c=perm[(perm[xi&255]+(yi+1))&255];const d=perm[(perm[(xi+1)&255]+(yi+1))&255];const ab=a+(b-a)*u,cd=c+(d-c)*u;return ab+(cd-ab)*v;}
function sn(x,y){return val2(x,y)*2-1;}
let W=0,H=0,DPR=1,cx=0,cy=0,R=1,view=0.5;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const K=7,SEG=14;
let shards=[];
function build(){
  R=Math.min(W,H)*0.42;
  shards=[];
  for(let i=0;i<K;i++){
    const base=i/K*TAU;
    const pts=[];
    for(let s=0;s<=SEG;s++){
      const u=s/SEG;
      const r=R*u;
      const zig=(s%2===0?1:-1)*0.11*(1-u)*Math.sin(i*2.1+s*1.7);
      pts.push([Math.cos(base+zig)*r,Math.sin(base+zig)*r]);
    }
    shards.push({pts,hue:196+i*9});
  }
}
function shardPoint(pts,u){
  const f=Math.max(0,Math.min(1,u));
  const x=SEG*f;
  const i=Math.min(SEG-1,Math.floor(x));
  const f2=x-i;
  const a=pts[i],b=pts[i+1];
  return [a[0]+(b[0]-a[0])*f2,a[1]+(b[1]-a[1])*f2];
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,12,0.32)';ctx.fillRect(0,0,W,H);
  view=0.5+(my>-1e8?(my-cy)/H*0.6:0);
  const ry=Math.cos(view);
  const rot=t*0.22;

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  ctx.scale(1,ry);
  ctx.lineCap='round';
  for(let i=0;i<K;i++){
    const sh=shards[i];
    // kristal kenarı (soluk)
    ctx.strokeStyle=`hsla(${sh.hue},55%,62%,0.15)`;
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let s=0;s<=SEG;s++){
      const p=sh.pts[s];
      if(s===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();
    // kenar boyunca akan ışık
    const u=(t*0.42+i*0.15)%1;
    const q=shardPoint(sh.pts,u);
    const hi=shardPoint(sh.pts,Math.max(0,u-0.05));
    ctx.strokeStyle=`hsla(${sh.hue+20},85%,80%,0.75)`;
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(hi[0],hi[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
    if(u>0.9){
      const gr=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],8);
      gr.addColorStop(0,`hsla(${sh.hue+20},85%,82%,0.8)`);
      gr.addColorStop(1,'hsla(220,80%,80%,0)');
      ctx.fillStyle=gr;ctx.fillRect(q[0]-8,q[1]-8,16,16);
    }
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.translate(cx,cy);
  ctx.scale(1,0.86);
  for(let i=0;i<K;i++){
    ctx.strokeStyle=`hsla(${shards[i].hue},55%,62%,0.35)`;
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let s=0;s<=SEG;s++){
      const p=shards[i].pts[s];
      if(s===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
