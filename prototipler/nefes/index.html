<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 10 — Nefes</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(1,2,4,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

function makeGlow(size,stops){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const[o,col]of stops)gr.addColorStop(o,col);
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  return c;
}
const soft=makeGlow(256,[
  [0,'rgba(190,225,255,0.9)'],
  [0.4,'rgba(150,200,255,0.4)'],
  [0.75,'rgba(120,170,240,0.12)'],
  [1,'rgba(120,170,240,0)'],
]);

let cx=0,cy=0,Rmax=1;

function build(){cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.30;}

function frame(now){
  const dt=now-last;last=now;
  const t=now/1000;
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);

  const focus=mx>-1e8?Math.max(0,1-Math.hypot(mx-cx,my-cy)/(H*0.8)):0.3;
  const breathe=0.5+0.5*Math.sin(t*0.85);
  const R=Rmax*(0.55+breathe*0.45)*(1+focus*0.14);
  const hue=215+32*Math.sin(t*0.06);

  ctx.save();ctx.globalCompositeOperation='lighter';

  // yumuşak ışık
  ctx.globalAlpha=0.5+0.2*Math.sin(t*0.85);
  const sz=R*7;
  ctx.drawImage(soft,cx-sz,cy-sz,sz*2,sz*2);

  // nefesle büyüyen halkalar
  for(let k=0;k<3;k++){
    const rk=R*(0.62+k*0.2)*(1+0.05*Math.sin(t*0.85*1.3+k*1.7));
    ctx.globalAlpha=(0.14-k*0.02)+0.06*Math.sin(t*0.85+k*2);
    ctx.strokeStyle=`hsla(${hue},65%,${70+ (k===2?8:0)}%,1)`;
    ctx.lineWidth=1+(k===2?1.4:0);
    ctx.beginPath();ctx.arc(cx,cy,rk,0,TAU);ctx.stroke();
  }

  // iç çekirdek
  ctx.globalAlpha=0.75;
  ctx.fillStyle=`hsla(${hue},70%,82%,0.9)`;
  ctx.beginPath();ctx.arc(cx,cy,R*0.09,0,TAU);ctx.fill();

  // uzak sabit halka
  ctx.globalAlpha=0.05;
  ctx.strokeStyle='rgba(200,225,255,1)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,Rmax*1.9,0,TAU);ctx.stroke();

  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const R=Rmax*0.7;
  const sz=R*7;
  ctx.globalAlpha=0.5;
  ctx.drawImage(soft,cx-sz,cy-sz,sz*2,sz*2);
  for(let k=0;k<3;k++){
    ctx.globalAlpha=0.1;
    ctx.strokeStyle='rgba(200,225,255,1)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,R*(0.62+k*0.2),0,TAU);ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
