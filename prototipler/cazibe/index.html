<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 17 — Cazibe</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let lines=[];

function build(){
  lines=[];
  const cols=Math.max(28,Math.min(60,Math.round(W/32)));
  const rows=Math.max(16,Math.min(34,Math.round(H/26)));
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=(c+0.5)/cols*W;
      const y=(r+0.5)/rows*H;
      lines.push({
        x,y,
        ang:rand()*TAU,
        len:13+rand()*12,
        hue:192+r/rows*36,
      });
    }
  }
}

function frame(now){
  const dt=now-last;last=now;
  const k=Math.min(dt,50)/16.67;
  const t=now/1000;
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';

  for(const L of lines){
    const sway=Math.sin(t*0.6+L.x*0.05+L.y*0.04)*0.07;
    let target=L.ang+sway;
    if(mx>-1e8){
      const dx=mx-L.x,dy=my-L.y;
      const d=Math.hypot(dx,dy);
      if(d<380){
        const inf=Math.exp(-d/170)*0.6;
        target=L.ang*(1-inf)+Math.atan2(dy,dx)*inf;
      }
    }
    let diff=(target-L.ang)%TAU;
    if(diff>Math.PI)diff-=TAU;
    if(diff<-Math.PI)diff+=TAU;
    L.ang+=diff*0.06;

    const depth=0.5+0.5*Math.sin(L.ang);
    ctx.strokeStyle=`hsla(${L.hue},55%,${58+12*depth}%,${0.18+0.14*depth})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(L.x,L.y);
    ctx.lineTo(L.x+Math.cos(L.ang)*L.len,L.y+Math.sin(L.ang)*L.len);
    ctx.stroke();
  }

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  for(const L of lines){
    ctx.strokeStyle='hsla(210,55%,60%,0.35)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L.x,L.y);
    ctx.lineTo(L.x+Math.cos(L.ang)*L.len,L.y+Math.sin(L.ang)*L.len);
    ctx.stroke();
  }
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
