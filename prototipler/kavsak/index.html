<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 23 — Kavşak</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const ARMN=70;
function makeArm(baseAng,turns){
  const pts=[];
  for(let i=0;i<=ARMN;i++){
    const u=i/ARMN;
    const a=baseAng+u*turns*TAU;
    const r=Rmax*u;
    pts.push([Math.cos(a)*r,Math.sin(a)*r]);
  }
  return pts;
}
let cw=[],ccw=[];
function build(){
  Rmax=Math.min(W,H)*0.46;
  cw=[makeArm(0,1.6),makeArm(TAU/2,1.6)];
  ccw=[makeArm(TAU/4,1.6),makeArm(TAU*0.75,1.6)];
}
let sparks=[];
function spawnSpark(x,y){
  if(sparks.length>120)sparks.shift();
  sparks.push({x,y,life:0.7,size:2.5,hue:215+rand()*40});
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,12,0.30)';ctx.fillRect(0,0,W,H);

  const rotC=t*0.5,rotW=-t*0.42;

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  function drawSet(arms,rot,hue){
    for(const arm of arms){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rot);
      ctx.strokeStyle=`hsla(${hue},55%,62%,0.18)`;
      ctx.lineWidth=0.7;
      ctx.beginPath();
      ctx.moveTo(arm[0][0],arm[0][1]);
      for(let i=1;i<=ARMN;i++)ctx.lineTo(arm[i][0],arm[i][1]);
      ctx.stroke();
      ctx.restore();
    }
  }
  drawSet(cw,rotC,205);
  drawSet(ccw,rotW,265);

  // kesişimlerde kıvılcım
  const S=16,step=Math.floor(ARMN/S);
  for(const a of cw){
    for(const b of ccw){
      for(let i=0;i<=ARMN;i+=step){
        const u=i/ARMN;
        const ca=rotC+u*1.6*TAU+(a===cw[0]?0:TAU/2);
        const cb=rotW+u*1.6*TAU+(b===ccw[0]?TAU/4:TAU*0.75);
        const ra=Rmax*u,rb=Rmax*u;
        const ax=cx+Math.cos(ca)*ra,ay=cy+Math.sin(ca)*ra;
        const bx=cx+Math.cos(cb)*rb,by=cy+Math.sin(cb)*rb;
        const ddx=ax-bx,ddy=ay-by;
        if(ddx*ddx+ddy*ddy<22*22)spawnSpark((ax+bx)/2,(ay+by)/2);
      }
    }
  }
  // kıvılcımlar
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.life-=dt/1000;
    if(s.life<=0){sparks.splice(i,1);continue;}
    const a=Math.max(0,s.life/0.7);
    ctx.fillStyle=`hsla(${s.hue},85%,80%,${a*0.9})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*a,0,TAU);ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;
  sparks=[];
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const arm of cw){
    ctx.strokeStyle='hsla(205,55%,62%,0.35)';
    ctx.lineWidth=0.7;
    ctx.beginPath();
    ctx.moveTo(cx+arm[0][0],cy+arm[0][1]);
    for(let i=1;i<=ARMN;i++)ctx.lineTo(cx+arm[i][0],cy+arm[i][1]);
    ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
