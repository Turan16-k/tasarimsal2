<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 02 — Elektrik</title>
<meta name="theme-color" content="#07060f">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#07060f;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(2,1,6,0.55) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let bolt=null;
function seg(a,b,d,arr,depth){
  if(depth<=0||Math.hypot(a[0]-b[0],a[1]-b[1])<9){arr.push(b);return;}
  const mid=[(a[0]+b[0])/2+(rand()-0.5)*d,(a[1]+b[1])/2+(rand()-0.5)*d];
  seg(a,mid,d*0.62,arr,depth-1);
  seg(mid,b,d*0.62,arr,depth-1);
}
function makeBolt(){
  const x0=W*(0.18+rand()*0.64),y0=H*0.06;
  const x1=x0+(rand()-0.5)*W*0.3,y1=H*0.94;
  const pts=[];
  seg([x0,y0],[x1,y1],H*0.34,pts,7);
  const branches=[];
  for(let i=0;i<pts.length;i+=7){
    if(rand()<0.5){
      const b=[];
      seg(pts[i],[pts[i][0]+(rand()-0.5)*W*0.16,pts[i][1]+rand()*H*0.18],H*0.18,b,4);
      if(b.length>2)branches.push(b);
    }
  }
  return {pts,branches,age:0,dur:0.30+rand()*0.4};
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const t=now/1000;
  ctx.fillStyle='#07060f';ctx.fillRect(0,0,W,H);
  if(!bolt||bolt.age>bolt.dur){bolt=makeBolt();bolt.age=0;}

  const p=bolt.age/bolt.dur;
  const flash=Math.sin(p*Math.PI);           // parla → sön
  const flick=0.6+0.4*rand();                // titreme
  const A=flash*flick;
  if(A>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';ctx.lineJoin='round';
    const hue=220+rand()*20;
    // geniş soluk hâle
    ctx.strokeStyle=`hsla(${hue},80%,60%,${A*0.20})`;ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(bolt.pts[0][0],bolt.pts[0][1]);
    for(let i=1;i<bolt.pts.length;i++)ctx.lineTo(bolt.pts[i][0],bolt.pts[i][1]);
    ctx.stroke();
    // çekirdek
    ctx.strokeStyle=`hsla(${hue},85%,78%,${A})`;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bolt.pts[0][0],bolt.pts[0][1]);
    for(let i=1;i<bolt.pts.length;i++)ctx.lineTo(bolt.pts[i][0],bolt.pts[i][1]);
    ctx.stroke();
    for(const b of bolt.branches){
      ctx.strokeStyle=`hsla(${hue},82%,72%,${A*0.7})`;ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(b[0][0],b[0][1]);
      for(let i=1;i<b.length;i++)ctx.lineTo(b[i][0],b[i][1]);
      ctx.stroke();
    }
    // bağlantı ışımaları (düğümler)
    for(let i=0;i<bolt.pts.length;i+=6){
      const pt=bolt.pts[i];
      ctx.fillStyle=`hsla(${hue},90%,85%,${A*0.5})`;
      ctx.beginPath();ctx.arc(pt[0],pt[1],1.3,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  bolt.age+=dt/1000;

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function renderStatic(){
  ctx.fillStyle='#07060f';ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
