<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 08 — Duman</title>
<meta name="theme-color" content="#060716">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#060716;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(1,1,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const Q=110;
const arms=[
  {ang0:0,hue:210},
  {ang0:TAU/3,hue:258},
  {ang0:TAU*2/3,hue:182},
].map(a=>Object.assign(a,{q:[]}));

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const t=now/1000;
  ctx.fillStyle='rgba(6,7,16,0.10)';ctx.fillRect(0,0,W,H);

  const cx=mx>-1e8?mx:W/2;
  const cy=my>-1e8?my:H/2;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<arms.length;i++){
    const arm=arms[i];
    const r0=10+i*9;
    const ang=arm.ang0+t*(0.5+0.06*i);
    const hx=cx+Math.cos(ang)*r0;
    const hy=cy+Math.sin(ang)*r0;
    arm.q.push([hx,hy]);
    if(arm.q.length>Q)arm.q.shift();
    const q=arm.q;
    for(let j=1;j<q.length;j++){
      const u=j/q.length;
      const al=u*u*0.45;
      ctx.strokeStyle=`hsla(${arm.hue},58%,${62+10*u}%,${al})`;
      ctx.lineWidth=0.4+u*1.0;
      ctx.beginPath();ctx.moveTo(q[j-1][0],q[j-1][1]);
      ctx.lineTo(q[j][0],q[j][1]);ctx.stroke();
    }
    ctx.fillStyle=`hsla(${arm.hue},70%,78%,0.8)`;
    ctx.beginPath();ctx.arc(hx,hy,1.6,0,TAU);ctx.fill();
  }
  // merkez yumuşak buhar
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,30);
  gr.addColorStop(0,'rgba(200,215,255,0.14)');
  gr.addColorStop(1,'rgba(200,215,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-30,cy-30,60,60);
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function renderStatic(){
  ctx.fillStyle='#060716';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<arms.length;i++){
    ctx.strokeStyle=`hsla(${arms[i].hue},58%,64%,0.5)`;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.arc(W/2,H/2,14+i*9,0,TAU);ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
