<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 19 — Sürü</title>
<meta name="theme-color" content="#04060c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04060c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const N=70;
let parts=[];
function build(){
  parts=[];
  for(let i=0;i<N;i++){
    parts.push({
      x:rand()*W,y:rand()*H,
      vx:(rand()-0.5)*1.2,vy:(rand()-0.5)*1.2,
      hue:200+rand()*50,
    });
  }
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(4,6,12,0.22)';ctx.fillRect(0,0,W,H);

  const tx=mx>-1e8?mx:W/2,ty=my>-1e8?my:H/2;
  for(const p of parts){
    // imlece doğru çekim
    const dx=tx-p.x,dy=ty-p.y;
    const d=Math.hypot(dx,dy)||1;
    const seek=Math.min(1,150/d);
    p.vx+=dx/d*seek*0.16*k;
    p.vy+=dy/d*seek*0.16*k;
    // komşularla ayrışma (çarpışma kaçınması)
    for(const q of parts){
      if(q===p)continue;
      const ddx=p.x-q.x,ddy=p.y-q.y;
      const dd=Math.hypot(ddx,ddy);
      if(dd<26&&dd>0.01){
        p.vx+=ddx/dd*0.20*k;
        p.vy+=ddy/dd*0.20*k;
      }
    }
    p.vx*=0.97;p.vy*=0.97;
    const sp=Math.hypot(p.vx,p.vy),mx2=2.4;
    if(sp>mx2){p.vx=p.vx/sp*mx2;p.vy=p.vy/sp*mx2;}
    p.x+=p.vx*k;p.y+=p.vy*k;
    // kenar sarma
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
  }

  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const sp=Math.hypot(p.vx,p.vy);
    const heat=Math.min(1,sp/2.4);
    ctx.fillStyle=`hsla(${p.hue-40*heat},68%,${58+30*heat}%,0.85)`;
    ctx.beginPath();ctx.arc(p.x,p.y,1.1+heat*1.1,0,TAU);ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    ctx.fillStyle=`hsla(${p.hue},68%,60%,0.5)`;
    ctx.beginPath();ctx.arc(p.x,p.y,1.3,0,TAU);ctx.fill();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
