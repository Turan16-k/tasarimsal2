<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 18 — Dalga</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let ripples=[],nextR=0.6;

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);

  if(t>nextR){
    const tx=mx>-1e8?mx:W/2;
    const ty=my>-1e8?my:H*0.5;
    ripples.push({cx:tx,cy:ty,born:t,dur:2.4+rand()*0.8,hue:185+rand()*50});
    if(ripples.length>6)ripples.shift();
    nextR=t+1.8+rand()*1.4;
  }

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(const r of ripples){
    const age=t-r.born;
    const p=age/r.dur;
    if(p>=1)continue;
    const rad=Rmax*(1-Math.pow(1-p,1.7));
    const al=Math.sin(p*Math.PI)*0.6;
    for(let ri=0;ri<2;ri++){
      const rr=rad*(1+ri*0.05);
      ctx.strokeStyle=`hsla(${r.hue},55%,62%,${al*(1-ri*0.35)})`;
      ctx.lineWidth=0.7;
      ctx.beginPath();
      for(let i=0;i<=100;i++){
        const a=i/100*TAU;
        const wob=rr*(1+0.03*Math.sin(a*7+t*2.5+r.born));
        const px=r.cx+Math.cos(a)*wob,py=r.cy+Math.sin(a)*wob;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.5;
  ripples=[];nextR=0.6;
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
