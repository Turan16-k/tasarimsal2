<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 03 — Toz</title>
<meta name="theme-color" content="#04070e">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04070e;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,6,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let dust=[];
function build(){
  dust=[];
  const n=Math.min(230,Math.round(W/9));
  for(let i=0;i<n;i++){
    dust.push({
      x:rand()*W,y:rand()*H,
      vx:0,vy:0,
      r:0.5+rand()*1.1,
      a:0.22+rand()*0.35,
      hue:198+rand()*60,
      flash:0,seed:rand()*10,
    });
  }
}
let sparkT=0;

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(4,7,14,0.16)';ctx.fillRect(0,0,W,H);

  // tozun sürüklenmesi
  for(const d of dust){
    d.vx+=(rand()-0.5)*0.05*k;
    d.vy+=(rand()-0.5)*0.05*k;
    if(mx>-1e8){
      const dx=mx-d.x,dy=my-d.y;
      const dist=Math.hypot(dx,dy);
      if(dist<220&&dist>0.5){
        const f=(1-dist/220)*0.05*k;
        d.vx+=dx/dist*f;
        d.vy+=dy/dist*f;
      }
    }
    d.vx*=0.985;d.vy*=0.985;
    d.x+=d.vx*k;d.y+=d.vy*k;
    if(d.x<-10)d.x=W+10;if(d.x>W+10)d.x=-10;
    if(d.y<-10)d.y=H+10;if(d.y>H+10)d.y=-10;
    if(d.flash>0)d.flash-=0.05*k;
  }

  // ara ara: yakın iki toz kıvılcımlanır
  sparkT-=dt/1000;
  if(sparkT<=0){
    sparkT=0.4+rand()*0.9;
    const a=dust[(rand()*dust.length)|0];
    let best=null,bd=34;
    for(const b of dust){
      if(b===a)continue;
      const dd=Math.hypot(a.x-b.x,a.y-b.y);
      if(dd<bd){bd=dd;best=b;}
    }
    if(best){a.flash=1;best.flash=1;dust._spark=[a,best];}
    else dust._spark=null;
  }

  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of dust){
    const tw=0.75+0.25*Math.sin(t*1.5+d.seed);
    const br=d.a*(tw+d.flash*2.2);
    ctx.fillStyle=`hsla(${d.hue},60%,${60+d.flash*22}%,${Math.min(1,br)})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r*(1+d.flash),0,TAU);ctx.fill();
  }
  if(dust._spark){
    const a=dust._spark[0],b=dust._spark[1];
    ctx.strokeStyle='rgba(190,225,255,0.7)';
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#04070e';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of dust){
    ctx.fillStyle=`hsla(${d.hue},60%,62%,${d.a*0.8})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,TAU);ctx.fill();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
