<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 21 — Örgü</title>
<meta name="theme-color" content="#06060d">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#06060d;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(1,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let sector=[];
function buildSector(){
  sector=[];
  const LEN=90;
  function grow(x,y,dir,len,depth){
    const x1=x+Math.cos(dir)*len,y1=y+Math.sin(dir)*len;
    sector.push({x0:x,y0:y,x1:x1,y1:y1,depth});
    if(depth>=4)return;
    for(let i=0;i<2;i++){
      const d2=dir+((i===0)?1:-1)*(0.5+rand()*0.35);
      grow(x1,y1,d2,len*0.62,depth+1);
    }
  }
  grow(0,0,-Math.PI/2,LEN,0);
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(6,6,13,0.30)';ctx.fillRect(0,0,W,H);

  const d=Math.hypot(mx-cx,my-cy);
  const focus=mx>-1e8?Math.max(0,1-d/Rmax):0;
  const rot=t*0.10*(1+focus*2.2);
  const sc=Rmax/240*(1+0.05*Math.sin(t*0.5));

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  const K=8;
  for(let kd=0;kd<K;kd++){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot+kd*TAU/K);
    ctx.scale(sc,sc);
    for(const sg of sector){
      const al=(1-sg.depth*0.16)*(0.16+focus*0.25);
      ctx.strokeStyle=`hsla(${220+kd*14+sg.depth*12},55%,68%,${al})`;
      ctx.lineWidth=Math.max(0.3,1.3-sg.depth*0.2)/sc*1.0;
      ctx.beginPath();ctx.moveTo(sg.x0,sg.y0);ctx.lineTo(sg.x1,sg.y1);ctx.stroke();
    }
    ctx.restore();
  }
  // merkez ışıma
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,Rmax*0.14);
  gr.addColorStop(0,`rgba(200,215,255,${0.14+focus*0.2})`);
  gr.addColorStop(1,'rgba(200,215,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-Rmax*0.14,cy-Rmax*0.14,Rmax*0.28,Rmax*0.28);
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.44;
  buildSector();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#06060d';ctx.fillRect(0,0,W,H);
  const sc=Rmax/240;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let kd=0;kd<8;kd++){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(kd*TAU/8);
    ctx.scale(sc,sc);
    for(const sg of sector){
      ctx.strokeStyle=`hsla(${220+kd*14+sg.depth*12},55%,68%,${(1-sg.depth*0.16)*0.35})`;
      ctx.lineWidth=0.6;
      ctx.beginPath();ctx.moveTo(sg.x0,sg.y0);ctx.lineTo(sg.x1,sg.y1);ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
