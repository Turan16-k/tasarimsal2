<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 21 — Sükunet</title>
<meta name="theme-color" content="#04060c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04060c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,R=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const rings=[
  {spd:0.05,r:0.25,hue:205},
  {spd:0.08,r:0.50,hue:212},
  {spd:0.11,r:0.75,hue:220},
];
const orbs=[
  {spd:0.022,r:0.32,hue:185},
  {spd:0.037,r:0.55,hue:200},
  {spd:0.052,r:0.72,hue:215},
];

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  // çekirdek imlece usulca sürüklenir
  if(mx>-1e8){cx+=(mx-cx)*0.015*k;cy+=(my-cy)*0.015*k;}

  const breathe=0.5+0.5*Math.sin(t*0.6);

  ctx.save();ctx.globalCompositeOperation='lighter';
  // çekirdek ışıması (uzun nefes)
  const cr=R*0.10*(1+0.3*breathe);
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,cr*2);
  gr.addColorStop(0,`rgba(205,220,255,${0.16+0.10*breathe})`);
  gr.addColorStop(0.6,'rgba(150,180,240,0.05)');
  gr.addColorStop(1,'rgba(150,180,240,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-cr*2,cy-cr*2,cr*4,cr*4);

  // yavaş halkalar
  for(const rn of rings){
    ctx.strokeStyle=`hsla(${rn.hue},50%,60%,0.06)`;
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let i=0;i<=64;i++){
      const a=i/64*TAU+rn.spd*t;
      const px=cx+Math.cos(a)*R*rn.r,py=cy+Math.sin(a)*R*rn.r*0.62;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // uzun periyotlu yörünge noktaları
  for(const o of orbs){
    const a=o.spd*t;
    const px=cx+Math.cos(a)*R*o.r,py=cy+Math.sin(a)*R*o.r*0.62;
    ctx.fillStyle=`hsla(${o.hue},55%,66%,0.7)`;
    ctx.beginPath();ctx.arc(px,py,1.3,0,TAU);ctx.fill();
    const g2=ctx.createRadialGradient(px,py,0,px,py,6);
    g2.addColorStop(0,`hsla(${o.hue},60%,70%,0.16)`);
    g2.addColorStop(1,'hsla(200,60%,70%,0)');
    ctx.fillStyle=g2;ctx.fillRect(px-6,py-6,12,12);
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;R=Math.min(W,H)*0.46;
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const rn of rings){
    ctx.strokeStyle=`hsla(${rn.hue},50%,60%,0.28)`;
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let i=0;i<=64;i++){
      const a=i/64*TAU;
      const px=cx+Math.cos(a)*R*rn.r,py=cy+Math.sin(a)*R*rn.r*0.62;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
