<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 09 — Karşılaşma</title>
<meta name="theme-color" content="#05070d">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070d;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
const norm=a=>{a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a;};
let W=0,H=0,DPR=1,cx=0,cy=0,R1=1,R2=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const N=7;
let cw=[],ccw=[],cd={},sparks=[];
function build(){
  cx=W/2;cy=H/2;R1=Math.min(W,H)*0.30;R2=Math.min(W,H)*0.42;
  cw=[];ccw=[];cd={};sparks=[];
  for(let i=0;i<N;i++){
    cw.push({ang:i/N*TAU+rand()*0.2,spd:0.85,len:R1*(0.8+rand()*0.4),hue:200});
    ccw.push({ang:i/N*TAU+rand()*0.2,spd:-0.85,len:R2*(0.7+rand()*0.4),hue:265});
  }
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,13,0.30)';ctx.fillRect(0,0,W,H);

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  // dönen ışınlar
  for(const s of cw){
    s.ang+=s.spd*k*0.016;
    ctx.strokeStyle=`hsla(${s.hue},60%,60%,0.35)`;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(s.ang)*s.len,cy+Math.sin(s.ang)*s.len);ctx.stroke();
  }
  for(const s of ccw){
    s.ang+=s.spd*k*0.016;
    ctx.strokeStyle=`hsla(${s.hue},55%,62%,0.30)`;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(s.ang)*s.len,cy+Math.sin(s.ang)*s.len);ctx.stroke();
  }
  // kavşaklar — zıt yönlü iki ışın karşılaşınca kıvılcım
  for(let i=0;i<N;i++){
    for(let j=0;j<N;j++){
      const d=norm(ccw[j].ang-cw[i].ang);
      const key=i*N+j;
      if(Math.abs(d)<0.08){
        if(!(key in cd)||t-cd[key]>1.2){
          cd[key]=t;
          const mid=(cw[i].ang+ccw[j].ang)/2;
          const px=cx+Math.cos(mid)*(R1+R2)/2;
          const py=cy+Math.sin(mid)*(R1+R2)/2;
          const tng=mid+Math.PI/2;
          for(let s=0;s<3;s++){
            const spd=60+rand()*110;
            sparks.push({
              x:px,y:py,
              vx:Math.cos(tng+ (rand()-0.5))*spd,
              vy:Math.sin(tng+ (rand()-0.5))*spd,
              life:1.4+rand()*0.8,hue:230+rand()*40,
            });
          }
        }
      } else { delete cd[key]; }
    }
  }
  // kıvılcımlar
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx*k;s.y+=s.vy*k;
    s.vx*=0.96;s.vy*=0.96;
    s.life-=dt/1000;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.fillStyle=`hsla(${s.hue},70%,78%,${Math.min(1,s.life)})`;
    ctx.beginPath();ctx.arc(s.x,s.y,1.3,0,TAU);ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of cw){
    ctx.strokeStyle='hsla(200,60%,60%,0.5)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(s.ang)*s.len,cy+Math.sin(s.ang)*s.len);ctx.stroke();
  }
  for(const s of ccw){
    ctx.strokeStyle='hsla(265,55%,62%,0.4)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(s.ang)*s.len,cy+Math.sin(s.ang)*s.len);ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
