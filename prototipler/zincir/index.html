<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 15 — Zincir</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,R=1,view=0.5;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const N=9,STEP=3;
function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,12,0.30)';ctx.fillRect(0,0,W,H);
  // imleç x'i hızı, y'si eğimi ayarlar
  const spd=0.5+(mx>-1e8?(mx-cx)/W*1.0:0);
  view=0.5+(my>-1e8?(my-cy)/H*0.7:0);
  const ry=Math.cos(view);
  const rot=t*spd;

  const pts=[];
  for(let i=0;i<N;i++){
    const a=rot+i*TAU/N;
    pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R*ry]);
  }

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  // dış zincir (komşu bağları)
  ctx.strokeStyle='rgba(150,180,240,0.16)';
  ctx.lineWidth=0.7;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const p=pts[i%N];
    if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
  }
  ctx.stroke();
  // iç yıldız — kesişimlerde ışık birikir
  for(let i=0;i<N;i++){
    const a=pts[i],b=pts[(i+STEP)%N];
    ctx.strokeStyle='rgba(210,225,255,0.24)';
    ctx.lineWidth=0.6;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
  // bağlantı noktaları
  for(let i=0;i<N;i++){
    const p=pts[i];
    ctx.fillStyle='rgba(225,238,255,0.85)';
    ctx.beginPath();ctx.arc(p[0],p[1],1.6,0,TAU);ctx.fill();
    const gr=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],7);
    gr.addColorStop(0,'rgba(190,215,255,0.20)');
    gr.addColorStop(1,'rgba(190,215,255,0)');
    ctx.fillStyle=gr;ctx.fillRect(p[0]-7,p[1]-7,14,14);
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;R=Math.min(W,H)*0.34;
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  const pts=[];
  for(let i=0;i<N;i++){
    const a=i*TAU/N;
    pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R*0.85]);
  }
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(150,180,240,0.4)';
  ctx.lineWidth=0.7;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const p=pts[i%N];
    if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
  }
  ctx.stroke();
  ctx.fillStyle='rgba(225,238,255,0.8)';
  for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],1.5,0,TAU);ctx.fill();}
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
