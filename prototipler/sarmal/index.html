<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 09 — Sarmal</title>
<meta name="theme-color" content="#05060c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05060c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(1,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

function makeGlow(size,stops){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const[o,col]of stops)gr.addColorStop(o,col);
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  return c;
}
const coreGold=makeGlow(256,[[0,'rgba(255,226,150,0.9)'],[0.4,'rgba(255,200,120,0.35)'],[1,'rgba(255,200,120,0)']]);
const coreCool=makeGlow(192,[[0,'rgba(170,215,255,0.8)'],[0.5,'rgba(140,190,255,0.3)'],[1,'rgba(140,190,255,0)']]);

const ARM_N=3,DOTS=72;
let cx=0,cy=0,R=1,arms=[];

function build(){
  cx=W/2;cy=H/2;R=Math.min(W,H)*0.44;
  arms=[];
  for(let a=0;a<ARM_N;a++){
    const arr=[];
    for(let i=0;i<DOTS;i++){
      const rf=i/(DOTS-1);
      arr.push({rf,ar:a*TAU/ARM_N+rf*3.2*TAU,r:4+rf*R});
    }
    arms.push(arr);
  }
}

function frame(now){
  const dt=now-last;last=now;
  const t=now/1000;
  ctx.fillStyle='#05060c';ctx.fillRect(0,0,W,H);

  const focus=mx>-1e8?Math.max(0,1-Math.hypot(mx-cx,my-cy)/(R*2.2)):0.4;
  const tilt=Math.max(0.12,Math.min(0.85,0.32+(mx>-1e8?(mx-cx)/W*0.6:0)));
  const rot=t*(0.10+focus*0.10);

  ctx.save();ctx.globalCompositeOperation='lighter';

  // merkez parıltıları
  const cg=R*0.55;
  ctx.globalAlpha=0.7;
  ctx.drawImage(coreGold,cx-cg,cy-cg,cg*2,cg*2);
  ctx.globalAlpha=0.4;
  ctx.drawImage(coreCool,cx-cg*0.8,cy-cg*0.8,cg*1.6,cg*1.6);

  // kollar — soluk iz + parlak noktalar
  for(const arm of arms){
    // soluk kol izi
    ctx.globalAlpha=0.05;
    ctx.strokeStyle='rgba(180,220,255,0.9)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(const d of arm){
      const ang=d.ar+rot;
      const x=cx+d.r*Math.cos(ang);
      const y=cy+d.r*Math.sin(ang)*Math.cos(tilt);
      if(d.rf===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();

    for(const d of arm){
      const ang=d.ar+rot;
      const ca=Math.cos(ang),sa=Math.sin(ang);
      const x=cx+d.r*ca;
      const y=cy+d.r*sa*Math.cos(tilt);
      const depth=0.5+0.5*sa;
      const br=0.30+0.55*depth;
      const sz=1.0+d.rf*2.4;
      const hue=250-58*d.rf;
      ctx.globalAlpha=br*(0.65+0.35*Math.sin(t*1.8+d.rf*22));
      ctx.fillStyle=`hsla(${hue},82%,${58+22*depth}%,0.95)`;
      ctx.beginPath();ctx.arc(x,y,sz,0,TAU);ctx.fill();
    }
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05060c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const cg=R*0.55;
  ctx.drawImage(coreGold,cx-cg,cy-cg,cg*2,cg*2);
  for(const arm of arms){
    for(const d of arm){
      const ang=d.ar+0.8;
      const x=cx+d.r*Math.cos(ang);
      const y=cy+d.r*Math.sin(ang)*Math.cos(0.35);
      ctx.globalAlpha=0.7;
      ctx.fillStyle='hsla(240,80%,65%,0.95)';
      ctx.beginPath();ctx.arc(x,y,1+d.rf*2,0,TAU);ctx.fill();
    }
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
