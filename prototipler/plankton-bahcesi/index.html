<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyss Garden — Biyolüminesan Plankton Bahçesi</title>
<meta name="theme-color" content="#020b14">
<style>
  /* ─────────────────────────────────────────────────────────────
     ABYSS GARDEN — prototip 01 (optimize)
     Tamamen bağımsız (CDN yok): çift tıkla, tarayıcıda aç.
     Parçalar: 1) yosun ormanı  2) ışık huzmeleri  3) plankton
     Performans: önceden render edilmiş sprite + önbellekli gradient
     ───────────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #010710;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 4, 10, 0.55) 100%);
  }

  .title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #d9f2e8;
    pointer-events: none;
    z-index: 5;
    animation: fade-in 2.2s ease-out both;
  }

  .title .kicker {
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(150, 235, 215, 0.55);
    margin-bottom: 22px;
    text-indent: 0.5em;
  }

  .title h1 {
    font-size: clamp(34px, 8vw, 92px);
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: 0.16em;
    color: #eafff7;
    text-shadow: 0 0 30px rgba(90, 220, 190, 0.35), 0 0 90px rgba(40, 160, 150, 0.25);
    animation: breathe 7s ease-in-out infinite;
  }

  .title h1 em {
    font-style: italic;
    color: #9fe8d4;
  }

  .title .sub {
    margin-top: 18px;
    font-size: clamp(12px, 1.6vw, 16px);
    font-style: italic;
    letter-spacing: 0.35em;
    color: rgba(217, 242, 232, 0.55);
  }

  .title .rule {
    width: 64px;
    height: 1px;
    margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, rgba(150, 235, 215, 0.7), transparent);
    animation: rule-grow 1.6s ease-out 0.6s both;
  }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.22em;
    color: rgba(200, 235, 225, 0.4);
    text-transform: uppercase;
    text-align: center;
    z-index: 5;
    pointer-events: none;
    animation: fade-in 2.2s ease-out 0.8s both;
    white-space: nowrap;
  }
  .hint b { color: rgba(170, 240, 220, 0.75); font-weight: 400; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 22px rgba(90, 220, 190, 0.28), 0 0 70px rgba(40, 160, 150, 0.18); }
    50%      { text-shadow: 0 0 44px rgba(120, 235, 205, 0.55), 0 0 120px rgba(50, 180, 170, 0.35); }
  }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .title, .hint { animation: none; opacity: 1; }
    .title .rule { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>


<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;

  // ─────────────────────────────────────────────────────────────
  // ÖNBELLEK 1 — sprite'lar (partikül başına gradient YOK, blit VAR)
  // ─────────────────────────────────────────────────────────────
  function makeGlow(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) grad.addColorStop(o, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  // plankton glow'ları — renk kovaları (yeşil→turkuaz→mavi)
  const PLAN_HUES = [];
  for (let hue = 110; hue <= 230; hue += 6) PLAN_HUES.push(hue);
  const planktonSprites = PLAN_HUES.map(h => makeGlow(64, [
    [0,     `hsla(${h}, 85%, 78%, 1)`],
    [0.35,  `hsla(${h}, 80%, 62%, 0.5)`],
    [1,     `hsla(${h}, 70%, 55%, 0)`],
  ]));

  // bulutsu lekeleri
  const nebulaSprites = [150, 190, 215].map(h => makeGlow(256, [
    [0, `hsla(${h}, 60%, 32%, 0.6)`],
    [1, `hsla(${h}, 60%, 32%, 0)`],
  ]));

  // kabarcıklar
  const bubbleSprite = makeGlow(128, [
    [0,    'rgba(255,255,255,0.9)'],
    [0.45, 'rgba(190,245,235,0.45)'],
    [1,    'rgba(190,245,235,0)'],
  ]);

  // ── imleç (yumuşatılmış) ──
  const mouse = { x: -1e4, y: -1e4 };
  let targetX = -1e4, targetY = -1e4;
  window.addEventListener('pointermove', (e) => { targetX = e.clientX; targetY = e.clientY; });
  window.addEventListener('pointerleave', () => { targetX = -1e4; targetY = -1e4; });

  // ── veri kümeleri + önbellekli gradient'ler ──
  let kelp = [];
  let plankton = [];
  let rays = [];
  let nebula = [];
  let bubbles = [];
  let bgGrad = null;

  function pickHue() {
    const r = Math.random();
    if (r < 0.45) return 155 + Math.random() * 15;
    if (r < 0.75) return 175 + Math.random() * 20;
    if (r < 0.9)  return 200 + Math.random() * 20;
    return 115 + Math.random() * 30;
  }

  function build() {
    kelp.length = 0; plankton.length = 0; rays.length = 0; nebula.length = 0; bubbles.length = 0;

    // arka plan gradient'ini bir kez kur
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#020c16');
    bgGrad.addColorStop(0.5, '#03222f');
    bgGrad.addColorStop(1, '#010710');

    // 1) yosun ormanı — gradient'i her şeritte BİR KEZ oluştur
    const strandCount = Math.max(6, Math.round(W / 80));
    for (let i = 0; i < strandCount; i++) {
      const baseY = H + 24;
      const len = H * (0.42 + Math.random() * 0.34);
      const hue = 150 + Math.random() * 18;
      const grad = ctx.createLinearGradient(0, baseY, 0, baseY - len);
      grad.addColorStop(0,   `hsla(${hue}, 55%, 10%, 0.92)`);
      grad.addColorStop(0.7, `hsla(${hue}, 65%, 26%, 0.5)`);
      grad.addColorStop(1,   `hsla(${hue}, 100%, 60%, 0.85)`);
      kelp.push({
        baseX: Math.random() * W, baseY, len,
        segments: 16,
        swayAmp: 20 + Math.random() * 26,
        speed: 0.35 + Math.random() * 0.5,
        phase: Math.random() * TAU,
        hue,
        width: 3 + Math.random() * 3.5,
        grad,
      });
    }

    // 2) ışık huzmeleri — gradient'i bir kez kur
    const rayCount = 5;
    for (let i = 0; i < rayCount; i++) {
      const len = 0.7 + Math.random() * 0.25;
      const alpha = 0.022 + Math.random() * 0.03;
      const grad = ctx.createLinearGradient(0, 0, 0, H * len);
      grad.addColorStop(0, `rgba(150,235,215,${alpha})`);
      grad.addColorStop(1, 'rgba(150,235,215,0)');
      rays.push({
        x: ((i + 0.5) / rayCount) * W + (Math.random() - 0.5) * 90,
        w: 40 + Math.random() * 100,
        angle: (Math.random() - 0.5) * 0.32,
        drift: 6 + Math.random() * 12,
        phase: Math.random() * TAU,
        len, alpha, grad,
      });
    }

    // 3) plankton — sprite indeksini build'de seç
    const count = Math.min(220, Math.round((W * H) / 9000));
    for (let i = 0; i < count; i++) {
      const bx0 = Math.random() * W;
      const by0 = Math.random() * H;
      const hue = pickHue();
      plankton.push({
        x: bx0, y: by0, bx0, by0,
        r: 0.7 + Math.random() * 1.9,
        sprite: Math.max(0, Math.min(planktonSprites.length - 1, Math.round((hue - 110) / 6))),
        phase: Math.random() * TAU,
        freq: 0.5 + Math.random() * 1.6,
        amp: 8 + Math.random() * 20,
        base: 0.5 + Math.random() * 0.4,
      });
    }

    // bulutsular
    const nebTemplates = [
      { hue: 0, a: 0.13 }, { hue: 1, a: 0.11 },
      { hue: 0, a: 0.10 }, { hue: 2, a: 0.11 },
    ];
    for (const n of nebTemplates) {
      nebula.push({
        x: Math.random() * W,
        y: H * (0.25 + Math.random() * 0.5),
        r: Math.max(W, H) * (0.35 + Math.random() * 0.25),
        sprite: nebulaSprites[n.hue],
        a: n.a,
        drift: 14 + Math.random() * 22,
        p: Math.random() * TAU,
      });
    }

    // kabarcıklar
    for (let i = 0; i < 10; i++) {
      bubbles.push({
        baseX: Math.random() * W,
        y: Math.random() * H,
        r: 7 + Math.random() * 40,
        speed: 0.18 + Math.random() * 0.45,
        wob: 8 + Math.random() * 16,
        phase: Math.random() * TAU,
        a: 0.03 + Math.random() * 0.05,
      });
    }
  }

  // ── arka plan + bulutsular (sprite blit) ──
  function drawBackground(t) {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of nebula) {
      const x = b.x + Math.sin(t * 0.02 + b.p) * b.drift;
      const y = b.y + Math.cos(t * 0.016 + b.p * 1.4) * b.drift;
      ctx.globalAlpha = b.a;
      ctx.drawImage(b.sprite, x - b.r, y - b.r, b.r * 2, b.r * 2);
    }
    ctx.restore();
  }

  // ── ışık huzmeleri ──
  function drawRays(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of rays) {
      const x = r.x + Math.sin(t * 0.03 + r.phase) * r.drift;
      ctx.save();
      ctx.translate(x, 0);
      ctx.rotate(r.angle);
      ctx.fillStyle = r.grad;
      ctx.fillRect(-r.w / 2, 0, r.w, H * r.len);
      ctx.restore();
    }
    ctx.restore();
  }

  // ── yosun şeritleri ──
  function drawKelp(t) {
    for (const st of kelp) {
      const n = st.segments;
      const pts = new Array(n + 1);
      for (let s = 0; s <= n; s++) {
        const tt = s / n;
        const sway =
          Math.sin(tt * 2.4 + t * st.speed + st.phase) * st.swayAmp * tt +
          Math.sin(tt * 1.3 + t * st.speed * 0.7 + st.phase * 1.7) * st.swayAmp * 0.4 * tt;
        pts[s] = [st.baseX + sway, st.baseY - tt * st.len];
      }

      const left = [], right = [];
      for (let s = 0; s <= n; s++) {
        const p0 = pts[Math.max(0, s - 1)];
        const p1 = pts[Math.min(n, s + 1)];
        let dx = p1[0] - p0[0], dy = p1[1] - p0[1];
        const L = Math.hypot(dx, dy) || 1;
        dx /= L; dy /= L;
        const half = st.width * (1 - (s / n) * 0.82);
        left.push([pts[s][0] - dy * half, pts[s][1] + dx * half]);
        right.push([pts[s][0] + dy * half, pts[s][1] - dx * half]);
      }

      ctx.beginPath();
      ctx.moveTo(right[0][0], right[0][1]);
      for (let s = 1; s <= n; s++) ctx.lineTo(right[s][0], right[s][1]);
      ctx.lineTo(left[n][0], left[n][1]);
      for (let s = n - 1; s >= 0; s--) ctx.lineTo(left[s][0], left[s][1]);
      ctx.closePath();
      ctx.fillStyle = st.grad;
      ctx.fill();

      // uçta parıltı (sprite blit)
      const tip = pts[n];
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35;
      ctx.drawImage(planktonSprites[Math.round((st.hue - 110) / 6)] || planktonSprites[5],
                    tip[0] - st.width * 6, tip[1] - st.width * 6,
                    st.width * 12, st.width * 12);
      ctx.restore();
    }
  }

  // ── plankton ──
  function updatePlankton(t, k, step) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < plankton.length; i += step) {
      const p = plankton[i];
      const driftX = p.bx0 + Math.sin(t * 0.06 + p.phase) * p.amp;
      const driftY = p.by0 + Math.cos(t * 0.05 + p.phase * 1.3) * p.amp * 0.7;

      p.x += (driftX - p.x) * 0.02 * k;
      p.y += (driftY - p.y) * 0.02 * k;

      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      const R = 130;
      if (d2 < R * R && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const f = (1 - d / R) * 7 * k;
        p.x += (dx / d) * f;
        p.y += (dy / d) * f;
      }

      const pulse = 0.55 + 0.45 * Math.sin(t * p.freq * 2 + p.phase * 3);
      const rad = p.r * (2 + pulse * 3.2);
      ctx.globalAlpha = p.base * pulse;
      ctx.drawImage(planktonSprites[p.sprite], p.x - rad, p.y - rad, rad * 2, rad * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ── kabarcıklar ──
  function drawBubbles(t, k, step) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < bubbles.length; i += step) {
      const b = bubbles[i];
      b.y -= b.speed * k;
      if (b.y < -b.r) { b.y = H + b.r; b.baseX = Math.random() * W; }
      const x = b.baseX + Math.sin(t * 0.4 + b.phase) * b.wob;
      ctx.globalAlpha = b.a;
      ctx.drawImage(bubbleSprite, x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ── boyutlandırma ──
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5); // performans sınırı
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (reduced) renderStatic();
  }

  function renderStatic() {
    drawBackground(0);
    drawRays(0);
    drawKelp(0);
    updatePlankton(0, 0, 1);
    drawBubbles(0, 0, 1);
  }

  // ── adaptif kalite: yavaşlarsa partikül yükünü azalt ──
  const frameTimes = [];
  let step = 1;

  function frame(now) {
    const dt = now - last;
    last = now;
    const k = Math.min(dt, 50) / 16.67;

    // 120 karelik ortalamayla karar ver (30fps altı → yükü yarıya indir)
    frameTimes.push(dt);
    if (frameTimes.length > 120) frameTimes.shift();
    if (frameTimes.length === 120) {
      const avg = frameTimes.reduce((a, b) => a + b, 0) / 120;
      if (avg > 34 && step < 4) step *= 2;
    }

    mouse.x += (targetX - mouse.x) * 0.1;
    mouse.y += (targetY - mouse.y) * 0.1;
    const t = now / 1000;

    drawBackground(t);
    drawRays(t);
    drawKelp(t);
    updatePlankton(t, k, step);
    drawBubbles(t, k, step);
    requestAnimationFrame(frame);
  }

  let last = performance.now();
  window.addEventListener('resize', resize);
  resize();

  if (!reduced) {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
