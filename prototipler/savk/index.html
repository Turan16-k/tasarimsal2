<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 18 — Şavk</title>
<meta name="theme-color" content="#05070d">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070d;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
const perm=new Uint8Array(512);
(function(){const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(rand()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
function val2(x,y){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const u=fade(xf),v=fade(yf);const a=perm[(perm[xi&255]+yi)&255];const b=perm[(perm[(xi+1)&255]+yi)&255];const c=perm[(perm[xi&255]+(yi+1))&255];const d=perm[(perm[(xi+1)&255]+(yi+1))&255];const ab=a+(b-a)*u,cd=c+(d-c)*u;return ab+(cd-ab)*v;}
function sn(x,y){return val2(x,y)*2-1;}
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const N=32;
let rings=[];
function build(){
  cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.46;
  rings=[];
  for(let i=0;i<5;i++){
    rings.push({spd:0.05+i*0.045,r:Rmax*(0.22+0.17*i),phase:rand()*9});
  }
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);

  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const rn of rings){
    // halkanın kendisi (çok silik)
    ctx.strokeStyle='rgba(150,180,240,0.045)';
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let i=0;i<=48;i++){
      const a=i/48*TAU;
      const px=cx+Math.cos(a)*rn.r,py=cy+Math.sin(a)*rn.r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // su üstünde parlayıp sönen noktalar
    for(let p=0;p<N;p++){
      const a=t*rn.spd+p/N*TAU;
      const rr=rn.r*(1+0.02*sn(p*1.3,t*0.3));
      const gl=Math.max(0,sn(p*0.6-t*0.7,rn.phase+p*0.13));
      if(gl<0.14)continue;
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
      ctx.fillStyle=`hsla(${192+24*gl},72%,72%,${gl*0.85})`;
      ctx.beginPath();ctx.arc(x,y,0.7+gl*1.7,0,TAU);ctx.fill();
    }
  }
  // imleç yakınında ışık odaklanması
  if(mx>-1e8){
    const gr=ctx.createRadialGradient(mx,my,0,mx,my,140);
    gr.addColorStop(0,'rgba(210,228,255,0.14)');
    gr.addColorStop(1,'rgba(210,228,255,0)');
    ctx.fillStyle=gr;ctx.fillRect(mx-140,my-140,280,280);
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const rn of rings){
    ctx.strokeStyle='rgba(150,180,240,0.3)';
    ctx.lineWidth=0.6;
    ctx.beginPath();
    for(let i=0;i<=48;i++){
      const a=i/48*TAU;
      const px=cx+Math.cos(a)*rn.r,py=cy+Math.sin(a)*rn.r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
