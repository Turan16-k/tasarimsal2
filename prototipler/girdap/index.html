<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 22 — Girdap</title>
<meta name="theme-color" content="#05070d">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070d;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
const perm=new Uint8Array(512);
(function(){const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(rand()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
function val2(x,y){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const u=fade(xf),v=fade(yf);const a=perm[(perm[xi&255]+yi)&255];const b=perm[(perm[(xi+1)&255]+yi)&255];const c=perm[(perm[xi&255]+(yi+1))&255];const d=perm[(perm[(xi+1)&255]+(yi+1))&255];const ab=a+(b-a)*u,cd=c+(d-c)*u;return ab+(cd-ab)*v;}
function sn(x,y){return val2(x,y)*2-1;}
let W=0,H=0,DPR=1,cx=0,cy=0,R=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const N=180;
let parts=[];
function build(){
  cx=W/2;cy=H/2;R=Math.min(W,H)*0.42;
  parts=[];
  for(let i=0;i<N;i++){
    parts.push({
      a:rand()*TAU,
      r:Math.pow(rand(),0.7)*R,
      spd:0.10+rand()*0.35,
      ph:rand()*9,
      hue:195+rand()*35,
    });
  }
}
function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,13,0.20)';ctx.fillRect(0,0,W,H);

  ctx.save();ctx.globalCompositeOperation='lighter';
  const S2=110*110;
  for(const p of parts){
    // imleç suda karıştırır: yakın parçacıklar teğetsel itilir
    const px=cx+Math.cos(p.a)*p.r,py=cy+Math.sin(p.a)*p.r*0.85;
    if(mx>-1e8){
      const ddx=mx-px,ddy=my-py;
      const d2=ddx*ddx+ddy*ddy;
      if(d2<S2){
        const d=Math.sqrt(d2)||1;
        const f=(1-d/110)*0.05*k;
        p.a+=f*0.9;
        p.r+=f*4;
        if(p.r>R)p.r=R;
      }
    }
    // yörünge sürüklenmesi: merkezde hızlı, dışta ağır
    p.a+=(p.spd*(1-p.r/R*0.55)+0.02)*k*0.016;
    const rr=p.r*(1+0.04*Math.sin(p.a*3+t*0.8+p.ph));
    const x=cx+Math.cos(p.a)*rr,y=cy+Math.sin(p.a)*rr*0.85;
    const tw=0.5+0.5*sn(p.ph+t*0.5,p.ph*1.7-t*0.3);
    ctx.fillStyle=`hsla(${p.hue+18*tw},70%,70%,${0.18+0.55*tw})`;
    ctx.beginPath();ctx.arc(x,y,0.6+tw*1.1,0,TAU);ctx.fill();
  }
  // çekirdek ışıması
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.14);
  gr.addColorStop(0,'rgba(205,222,255,0.10)');
  gr.addColorStop(1,'rgba(205,222,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-R*0.14,cy-R*0.14,R*0.28,R*0.28);
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r*0.85;
    ctx.fillStyle=`hsla(${p.hue},70%,70%,0.5)`;
    ctx.beginPath();ctx.arc(x,y,1,0,TAU);ctx.fill();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
