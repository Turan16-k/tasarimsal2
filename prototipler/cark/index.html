<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 01 — Çark</title>
<meta name="theme-color" content="#05070f">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070f;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,6,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let lines=[];
function build(){
  cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.46;
  lines=[];
  for(let i=0;i<46;i++){
    lines.push({
      ang:rand()*TAU,
      len:Rmax*(0.18+rand()*0.82),
      spd:(0.15+rand()*0.55)*(rand()<0.5?1:-1),
      hue:208+rand()*70,
      a:0.10+rand()*0.13,
    });
  }
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  // iz bırakan silme
  ctx.fillStyle='rgba(5,7,15,0.38)';ctx.fillRect(0,0,W,H);
  const focus=mx>-1e8?Math.max(0,1-Math.hypot(mx-cx,my-cy)/(H*0.8)):0;

  ctx.save();ctx.globalCompositeOperation='lighter';
  // iç içe soluk çemberler — döngüsellik
  ctx.lineWidth=0.6;
  for(let i=0;i<3;i++){
    ctx.strokeStyle=`hsla(${225+i*12},45%,55%,${0.05+0.02*Math.sin(t*0.5+i)})`;
    ctx.beginPath();ctx.arc(cx,cy,Rmax*(0.22+i*0.26),0,TAU);ctx.stroke();
  }
  // dönen ışınlar
  ctx.lineCap='round';
  for(const L of lines){
    L.ang+=L.spd*k*0.012*(1+focus*1.5);
    const x1=cx+Math.cos(L.ang)*L.len;
    const y1=cy+Math.sin(L.ang)*L.len;
    ctx.strokeStyle=`hsla(${L.hue},62%,${62+10*focus}%,${L.a*(0.7+0.5*focus)})`;
    ctx.lineWidth=0.7+1.1*(1-L.len/Rmax);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x1,y1);ctx.stroke();
    // uç noktası
    ctx.fillStyle=`hsla(${L.hue},70%,${70+12*focus}%,${Math.min(1,L.a*1.6)})`;
    ctx.beginPath();ctx.arc(x1,y1,1.2,0,TAU);ctx.fill();
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const L of lines){
    ctx.strokeStyle=`hsla(${L.hue},62%,62%,0.5)`;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(L.ang)*L.len,cy+Math.sin(L.ang)*L.len);ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
