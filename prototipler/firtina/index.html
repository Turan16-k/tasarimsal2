<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 04 — Fırtına</title>
<meta name="theme-color" content="#060812">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#060812;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,1,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const ARMS=4,PER=38;
let parts=[];
function build(){
  Rmax=Math.min(W,H)*0.46;
  parts=[];
  for(let a=0;a<ARMS;a++)for(let i=0;i<PER;i++)parts.push({a,i});
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const t=now/1000;
  ctx.fillStyle='rgba(6,8,18,0.30)';ctx.fillRect(0,0,W,H);

  const cx=mx>-1e8?mx:W/2;
  const cy=my>-1e8?my:H/2;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(const p of parts){
    const u=p.i/PER;
    const ang=t*1.6+p.a*TAU/ARMS+u*5.0;         // içte hızlı, dışta yavaş
    const r=Rmax*(0.10+u*0.88);                 // dıştan içe sıkışma
    const x=cx+Math.cos(ang)*r;
    const y=cy+Math.sin(ang)*r*0.86;            // hafif elips derinliği
    const hot=1-u;                              // merkeze yakın parlak
    ctx.strokeStyle=`hsla(${210+u*70},60%,${58+hot*16}%,${0.05+hot*0.30})`;
    ctx.lineWidth=0.7+hot*1.1;
    ctx.beginPath();ctx.moveTo(x,y);
    ctx.lineTo(x-Math.cos(ang)*r*0.06,y-Math.sin(ang)*r*0.06);
    ctx.stroke();
  }
  // merkez çekirdeği
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,Rmax*0.22);
  gr.addColorStop(0,'rgba(220,230,255,0.35)');
  gr.addColorStop(1,'rgba(150,180,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-Rmax*0.22,cy-Rmax*0.22,Rmax*0.44,Rmax*0.44);
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#060812';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let a=0;a<ARMS;a++){
    for(let i=0;i<PER;i++){
      const u=i/PER;
      const ang=a*TAU/ARMS+u*5.0;
      const r=Rmax*(0.10+u*0.88);
      ctx.fillStyle=`hsla(${210+u*70},60%,64%,0.4)`;
      ctx.beginPath();ctx.arc(W/2+Math.cos(ang)*r,H/2+Math.sin(ang)*r*0.86,1,0,TAU);ctx.fill();
    }
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
