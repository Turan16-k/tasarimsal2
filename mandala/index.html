<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Mandala — Işığın Çizdiği Geometri</title>
<meta name="theme-color" content="#04060e">
<style>
  /* ─────────────────────────────────────────────────────────────
     SACRED MANDALA — çizgi atölyesi 01
     Tamamen bağımsız (CDN yok). Canvas2D.
     Tek fikir: saf çizgiler. Işık her çizgiyi çizer, parlatır,
     söndürür ve yeniden çizer — mandala kendini sonsuza dek kurar.
     ───────────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #03040c;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; display: block; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(1, 2, 8, 0.6) 100%);
  }

  .title {
    position: fixed; top: 8%; left: 50%;
    transform: translateX(-50%);
    text-align: center; color: #eef4ff; pointer-events: none; z-index: 5;
    animation: fade-in 2.4s ease-out both;
  }
  .title .kicker {
    font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(150, 245, 255, 0.6); margin-bottom: 20px; text-indent: 0.5em;
  }
  .title h1 {
    font-size: clamp(30px, 7vw, 82px); font-weight: 400; line-height: 0.98;
    letter-spacing: 0.14em; color: #f2f8ff;
    text-shadow: 0 0 34px rgba(90, 220, 255, 0.4), 0 0 100px rgba(255, 215, 130, 0.28);
    animation: breathe 8s ease-in-out infinite;
  }
  .title h1 em { font-style: italic; color: #ffd77a; }
  .title .sub {
    margin-top: 16px; font-size: clamp(12px, 1.6vw, 16px);
    font-style: italic; letter-spacing: 0.35em; color: rgba(210, 230, 255, 0.55);
  }
  .title .rule {
    width: 64px; height: 1px; margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, rgba(140, 230, 255, 0.7), transparent);
    animation: rule-grow 1.6s ease-out 0.6s both;
  }
  .hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.22em; color: rgba(200, 225, 250, 0.45);
    text-transform: uppercase; text-align: center; z-index: 5; pointer-events: none;
    animation: fade-in 2.2s ease-out 0.8s both; white-space: nowrap;
  }
  .hint b { color: rgba(255, 220, 150, 0.85); font-weight: 400; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 24px rgba(90, 220, 255, 0.3), 0 0 80px rgba(255, 215, 130, 0.2); }
    50%      { text-shadow: 0 0 50px rgba(120, 235, 255, 0.55), 0 0 140px rgba(255, 230, 160, 0.4); }
  }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .title, .hint { animation: none; opacity: 1; }
    .title .rule { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>


<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = Math.random;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 1;

  function makeGlow(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) grad.addColorStop(o, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  const headCyan = makeGlow(48, [
    [0, 'rgba(190,255,255,1)'],
    [0.5, 'rgba(120,240,255,0.55)'],
    [1, 'rgba(120,240,255,0)'],
  ]);
  const headGold = makeGlow(48, [
    [0, 'rgba(255,240,190,1)'],
    [0.5, 'rgba(255,215,130,0.55)'],
    [1, 'rgba(255,215,130,0)'],
  ]);

  let bgGrad = null;
  let paths = [];

  function circlePath(r, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }
  function spokePath(a) {
    return [[cx + Math.cos(a) * R * 0.02, cy + Math.sin(a) * R * 0.02],
            [cx + Math.cos(a) * R * 0.72, cy + Math.sin(a) * R * 0.72]];
  }
  function petalPath(a, r0, r1) {
    const rm = (r0 + r1) / 2;
    const pr = (r1 - r0) / 2;
    const n = 22;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const th = -Math.PI / 2 + (i / n) * Math.PI;
      const off = pr * Math.cos(th);
      pts.push([
        cx + Math.cos(a) * rm + Math.cos(a) * off,
        cy + Math.sin(a) * rm + Math.sin(a) * off,
      ]);
    }
    return pts;
  }

  function addPath(pts, color, delay, sprite, width) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    paths.push({ pts, cum, len: cum[cum.length - 1] || 1, color, delay, sprite, width });
  }

  function pointAt(p, f) {
    const target = f * p.len;
    let i = 0;
    while (i < p.cum.length - 1 && p.cum[i + 1] < target) i++;
    const seg = (p.cum[i + 1] - p.cum[i]) || 1;
    const tt = (target - p.cum[i]) / seg;
    return {
      x: p.pts[i][0] + (p.pts[i + 1][0] - p.pts[i][0]) * tt,
      y: p.pts[i][1] + (p.pts[i + 1][1] - p.pts[i][1]) * tt,
    };
  }

  function strokeRange(p, f0, f1) {
    const t0 = p.len * Math.max(0, f0);
    const t1 = p.len * Math.min(1, f1);
    let i0 = 0; while (i0 < p.cum.length - 1 && p.cum[i0 + 1] < t0) i0++;
    let i1 = i0; while (i1 < p.cum.length - 1 && p.cum[i1 + 1] < t1) i1++;
    const start = f0 <= 0 ? p.pts[0] : pointAt(p, Math.max(0, f0));
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
    const end = pointAt(p, Math.min(1, f1));
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
  }

  function build() {
    paths.length = 0;
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.44;

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#050a18');
    bgGrad.addColorStop(0.5, '#04080f');
    bgGrad.addColorStop(1, '#030409');

    const CY = 'rgba(120,240,255,0.9)';
    const GD = 'rgba(255,215,130,0.9)';

    addPath(circlePath(R * 0.05, 40), CY, 0, headCyan, 1.2);
    const radii = [0.16, 0.3, 0.44, 0.58, 0.7];
    radii.forEach((rr, k) => {
      addPath(circlePath(rr * R, 52 + k * 6), k % 2 ? GD : CY, 0.04 + k * 0.05,
              k % 2 ? headGold : headCyan, 1.2);
    });
    // taç yaprakları
    for (let k = 0; k < radii.length - 1; k++) {
      for (let a = 0; a < 12; a++) {
        addPath(petalPath((a / 12) * TAU, radii[k] * R, radii[k + 1] * R),
                GD, 0.08 + k * 0.03 + a * 0.004, headGold, 1.1);
      }
    }
    // kollar
    for (let a = 0; a < 12; a++) {
      addPath(spokePath((a / 12) * TAU), CY, 0.02 + a * 0.006, headCyan, 1.1);
    }
    // dış çember
    addPath(circlePath(R * 0.8, 88), CY, 0.3, headCyan, 1.3);
  }

  function drawPath(p, head, t) {
    // ortaya çıkma: çizilir, parlar, sönümlenir, yeniden çizilir
    const em = head < 0.1 ? head / 0.1 : (head > 0.9 ? (1 - head) / 0.1 : 1);

    // taban çizgi
    ctx.globalAlpha = em * 0.4;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.width;
    ctx.beginPath();
    ctx.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let i = 1; i < p.pts.length; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
    ctx.stroke();

    // aydınlatılmış parça
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = em;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = p.width * 2.2;
    strokeRange(p, head - 0.09, head);
    ctx.globalCompositeOperation = 'source-over';

    // çizim ucu
    const h = pointAt(p, head);
    const hs = 7 + p.width * 5;
    ctx.globalAlpha = em;
    ctx.drawImage(p.sprite, h.x - hs, h.y - hs, hs * 2, hs * 2);
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = now - last; last = now;
    const t = now / 1000;

    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.05);
    ctx.translate(-cx, -cy);

    for (const p of paths) {
      const head = (t * 0.16 + p.delay) % 1;
      drawPath(p, head, t);
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (reduced) renderStatic();
  }

  function renderStatic() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(0.5);
    ctx.translate(-cx, -cy);
    for (const p of paths) {
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.width;
      ctx.beginPath();
      ctx.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let i = 1; i < p.pts.length; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
