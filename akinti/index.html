<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 14 — Akıntı</title>
<meta name="theme-color" content="#05070d">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070d;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
const perm=new Uint8Array(512);
(function(){const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(rand()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
function val2(x,y){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const u=fade(xf),v=fade(yf);const a=perm[(perm[xi&255]+yi)&255];const b=perm[(perm[(xi+1)&255]+yi)&255];const c=perm[(perm[xi&255]+(yi+1))&255];const d=perm[(perm[(xi+1)&255]+(yi+1))&255];const ab=a+(b-a)*u,cd=c+(d-c)*u;return ab+(cd-ab)*v;}
function sn(x,y){return val2(x,y)*2-1;}
let W=0,H=0,DPR=1,cx=0,cy=0,Rmax=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

const T=9,TURNS=2.4,NSEG=90;
function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='rgba(5,7,13,0.22)';ctx.fillRect(0,0,W,H);
  // girdabın ağzı imleci usulca izler
  if(mx>-1e8){cx+=(mx-cx)*0.03*k;cy+=(my-cy)*0.03*k;}

  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(let i=0;i<T;i++){
    const base=i/T*TAU;
    const pts=[];
    for(let s=0;s<=NSEG;s++){
      const u=s/NSEG;
      const r=Rmax*u*(0.85+0.15*Math.sin(t*0.4+base*3));
      const wob=0.10*(1-u)+0.05;
      const a=base+u*TURNS*TAU+sn(u*3,t*0.22+i)*wob;
      pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);
    }
    ctx.strokeStyle='hsla(205,55%,62%,0.13)';
    ctx.lineWidth=0.7;
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let s=1;s<=NSEG;s++)ctx.lineTo(pts[s][0],pts[s][1]);
    ctx.stroke();
    // ipin ucundan akan ışık
    const h=(t*0.32+i*0.17)%1;
    const hi=Math.floor(h*NSEG);
    const p0=pts[Math.max(0,hi-2)],p1=pts[Math.min(NSEG,hi+2)];
    ctx.strokeStyle=`hsla(${215+i*4},80%,78%,0.6)`;
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=H/2;Rmax=Math.min(W,H)*0.44;
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(let i=0;i<T;i++){
    const base=i/T*TAU;
    ctx.strokeStyle='hsla(205,55%,62%,0.35)';
    ctx.lineWidth=0.7;
    ctx.beginPath();
    for(let s=0;s<=NSEG;s++){
      const u=s/NSEG;
      const a=base+u*TURNS*TAU;
      const x=cx+Math.cos(a)*Rmax*u,y=cy+Math.sin(a)*Rmax*u;
      if(s===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
