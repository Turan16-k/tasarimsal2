<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Downpour — Synthwave Kent Yağmuru</title>
<meta name="theme-color" content="#14042e">
<style>
  /* ─────────────────────────────────────────────────────────────
     NEON DOWNPOUR — prototip 07 (synthwave)
     Tamamen bağımsız (CDN yok). Canvas2D.
     Parçalar: 1) retro güneş + bantlı gökyüzü + yıldızlar
              2) neon perspektif grid'i  3) kent silüeti + ışıklı
              pencereler  4) yağmur + grid'e düşen halkalar
     ───────────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0b0120;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; display: block; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(6, 0, 20, 0.55) 100%);
  }

  .title {
    position: fixed; top: 6%; left: 50%;
    transform: translateX(-50%);
    text-align: center; color: #ffe9f4; pointer-events: none; z-index: 5;
    animation: fade-in 2.4s ease-out both;
  }
  .title .kicker {
    font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(255, 150, 220, 0.6); margin-bottom: 20px; text-indent: 0.5em;
  }
  .title h1 {
    font-size: clamp(34px, 8vw, 88px); font-weight: 400; line-height: 0.98;
    letter-spacing: 0.14em; color: #ffedf7;
    text-shadow: 0 0 34px rgba(255, 47, 158, 0.5), 0 0 100px rgba(0, 229, 255, 0.35);
    animation: neon 3.6s ease-in-out infinite;
  }
  .title h1 em { font-style: italic; color: #7ff5ff; }
  .title .sub {
    margin-top: 16px; font-size: clamp(12px, 1.6vw, 16px);
    font-style: italic; letter-spacing: 0.35em; color: rgba(255, 190, 230, 0.6);
  }
  .title .rule {
    width: 64px; height: 1px; margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, rgba(255, 80, 200, 0.8), transparent);
    animation: rule-grow 1.6s ease-out 0.6s both;
  }
  .hint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.22em; color: rgba(255, 170, 230, 0.5);
    text-transform: uppercase; text-align: center; z-index: 5; pointer-events: none;
    animation: fade-in 2.2s ease-out 0.8s both; white-space: nowrap;
  }
  .hint b { color: rgba(127, 245, 255, 0.9); font-weight: 400; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes neon {
    0%, 100% { text-shadow: 0 0 24px rgba(255, 47, 158, 0.4), 0 0 80px rgba(0, 229, 255, 0.28); }
    50%      { text-shadow: 0 0 52px rgba(255, 90, 190, 0.7), 0 0 150px rgba(60, 240, 255, 0.5); }
  }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .title, .hint { animation: none; opacity: 1; }
    .title .rule { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>


<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = Math.random;

  let W = 0, H = 0, DPR = 1, horizon = 0;

  function makeGlow(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) grad.addColorStop(o, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  const sunGlow = makeGlow(256, [
    [0, 'rgba(255,120,220,0.6)'],
    [1, 'rgba(255,120,220,0)'],
  ]);
  const starSprite = makeGlow(24, [
    [0, 'rgba(255,255,255,1)'],
    [0.5, 'rgba(255,230,250,0.4)'],
    [1, 'rgba(255,230,250,0)'],
  ]);

  let stars = [], buildings = [], rains = [], ripples = [], skyGrad = null, sunGrad = null;

  function build() {
    stars.length = 0; buildings.length = 0; rains.length = 0; ripples.length = 0;

    horizon = H * 0.56;

    skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGrad.addColorStop(0, '#1a0540');
    skyGrad.addColorStop(0.5, '#7a1253');
    skyGrad.addColorStop(0.85, '#ff5e00');
    skyGrad.addColorStop(1, '#ff9d00');

    sunGrad = ctx.createLinearGradient(0, horizon - 1, 0, horizon);
    sunGrad.addColorStop(0, '#ffe38a');
    sunGrad.addColorStop(0.4, '#ff9d1f');
    sunGrad.addColorStop(0.75, '#ff2f9e');
    sunGrad.addColorStop(1, '#7a0f5e');

    // yıldızlar
    const nStars = Math.min(80, Math.round(W / 20));
    for (let i = 0; i < nStars; i++) {
      stars.push({
        x: rand() * W,
        y: rand() * horizon * 0.45,
        r: 0.5 + rand() * 1.1,
        tw: 0.4 + rand() * 1.2,
        ph: rand() * TAU,
      });
    }

    // kent silüeti
    let bx = -10;
    while (bx < W + 10) {
      const bw = 20 + rand() * 46;
      const bh = (20 + rand() * 90) * (W / 900);
      const b = {
        x: bx, w: bw, h: Math.min(bh, horizon - 20),
        win: [],
      };
      const winRows = Math.floor(b.h / 14);
      const winCols = Math.max(1, Math.floor(bw / 12));
      for (let r = 0; r < winRows; r++) {
        for (let c = 0; c < winCols; c++) {
          if (rand() < 0.5) {
            b.win.push({
              wx: b.x + 3 + c * 8,
              wy: horizon - b.h + 5 + r * 12,
              lit: rand() < 0.5,
              tint: rand() < 0.6 ? '255,120,255' : (rand() < 0.5 ? '0,230,255' : '255,240,170'),
              tw: rand() < 0.3 ? 0.5 + rand() * 1 : 0,
              ph: rand() * TAU,
            });
          }
        }
      }
      buildings.push(b);
      bx += bw + rand() * 4;
    }

    // yağmur
    const nRain = Math.min(150, Math.round(W / 12));
    for (let i = 0; i < nRain; i++) {
      rains.push({
        x: rand() * W,
        y: rand() * H,
        len: 10 + rand() * 26,
        sp: 14 + rand() * 18,
        a: 0.12 + rand() * 0.16,
      });
    }
  }

  function drawSky(t) {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizon);

    // retro güneş — yarım daire + bant çizgileri
    const cx = W / 2;
    const r = Math.min(W, H) * 0.17;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, horizon);
    ctx.clip();

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(sunGlow, cx - r * 2.6, horizon - r * 2.2, r * 5.2, r * 4.4);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    ctx.arc(cx, horizon, r, Math.PI, TAU);
    ctx.closePath();
    ctx.fillStyle = sunGrad;
    ctx.fill();
    // dikey degrade bantlar (ışık çizgileri)
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const y = horizon - r * (0.25 + i * 0.16);
      const w = r * Math.sqrt(1 - Math.pow(1 - (0.25 + i * 0.16), 2));
      ctx.beginPath();
      ctx.moveTo(cx - w, y);
      ctx.lineTo(cx + w, y);
      ctx.stroke();
    }
    ctx.restore();

    // yıldızlar
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.drawImage(starSprite, s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    }
    ctx.restore();
  }

  function drawCity(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of buildings) {
      // gövde
      ctx.fillStyle = 'rgba(20,4,50,0.96)';
      ctx.fillRect(b.x, horizon - b.h, b.w, b.h + 2);
      // kenar neonu
      ctx.fillStyle = 'rgba(255,60,180,0.25)';
      ctx.fillRect(b.x, horizon - b.h, b.w, 2);
      // pencereler
      for (const w of b.win) {
        let a = 0.8;
        if (w.tw) a = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * w.tw + w.ph));
        ctx.fillStyle = w.lit ? `rgba(${w.tint},${a})` : 'rgba(30,10,60,0.9)';
        ctx.fillRect(w.wx, w.wy, 4, 7);
      }
    }
    ctx.restore();
  }

  function drawGrid(t) {
    ctx.save();
    // zemin
    const floorGrad = ctx.createLinearGradient(0, horizon, 0, H);
    floorGrad.addColorStop(0, '#16043a');
    floorGrad.addColorStop(1, '#0a0220');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, horizon, W, H - horizon);

    const cx = W / 2;
    // yatay çizgiler — perspektif, izleyiciye doğru akar
    const rows = 15;
    for (let i = 0; i < rows; i++) {
      const tt = (i + (t * 2.2)) / rows;
      const k = tt % 1;
      const y = horizon + (H - horizon) * k * k;
      const neon = i % 2 === 0;
      ctx.strokeStyle = neon ? 'rgba(255,47,158,0.75)' : 'rgba(0,229,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    // dikey çizgiler — ufukta birleşir
    const half = 10;
    for (let j = -half; j <= half; j++) {
      const xTop = cx + j * (W / (half * 2.6));
      const xBot = cx + j * (W / (half * 0.9));
      ctx.strokeStyle = j === 0 ? 'rgba(255,47,158,0.9)' : 'rgba(255,47,158,0.45)';
      ctx.lineWidth = j === 0 ? 2.4 : 1.6;
      ctx.beginPath();
      ctx.moveTo(xTop, horizon);
      ctx.lineTo(xBot, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRain(t, k) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const r of rains) {
      r.y += r.sp * k;
      if (r.y - r.len > H) { r.y = -r.len; r.x = rand() * W; }
      ctx.strokeStyle = `rgba(190,240,255,${r.a})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y - r.len);
      ctx.lineTo(r.x + 2, r.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function spawnRipple(x, y) {
    if (y > horizon + 6 && y < H - 4) {
      const yy = y;
      const scale = (yy - horizon) / (H - horizon);
      ripples.push({ x, y: yy, age: 0, max: 0.5 + rand() * 0.5, s: (0.6 + rand()) * scale });
    }
  }

  function drawRipples(t, k) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.age += k / 60;
      if (rp.age >= rp.max) { ripples.splice(i, 1); continue; }
      const p = rp.age / rp.max;
      const rx = rp.s * 120 * p;
      ctx.globalAlpha = (1 - p) * 0.5;
      ctx.strokeStyle = 'rgba(0,229,255,1)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rx, rx * 0.18, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  let rippleAcc = 0;
  function frame(now) {
    const dt = now - last; last = now;
    const k = Math.min(dt, 50) / 16.67;
    const t = now / 1000;

    drawSky(t);
    drawGrid(t);
    drawCity(t);
    drawRain(t, k);

    // nadiren grid'e damla halkası düşür
    rippleAcc += dt;
    if (rippleAcc > 140) {
      rippleAcc = 0;
      spawnRipple(rand() * W, horizon + 6 + rand() * (H - horizon - 12));
    }
    drawRipples(t, k);

    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (reduced) renderStatic();
  }

  function renderStatic() {
    const t = 1;
    drawSky(t);
    drawGrid(t);
    drawCity(t);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
