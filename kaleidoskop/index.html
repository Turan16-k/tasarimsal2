<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleido Skop — Altı Aynalı Simetri</title>
<meta name="theme-color" content="#070310">
<style>
  /* ─────────────────────────────────────────────────────────────
     KALEIDO SKOP — çizgi atölyesi 04
     Tamamen bağımsız (CDN yok). Canvas2D.
     Tek hücredeki çizgiler altı aynaya yansır; ışık tüm sektörlerde
     aynı anda çizer — eşzamanlı, simetrik bir ortaya çıkış.
     ───────────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #06020f;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; display: block; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(3, 0, 10, 0.6) 100%);
  }

  .title {
    position: fixed; top: 8%; left: 50%;
    transform: translateX(-50%);
    text-align: center; color: #f4ecff; pointer-events: none; z-index: 5;
    animation: fade-in 2.4s ease-out both;
  }
  .title .kicker {
    font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(210, 150, 255, 0.6); margin-bottom: 20px; text-indent: 0.5em;
  }
  .title h1 {
    font-size: clamp(30px, 7vw, 82px); font-weight: 400; line-height: 0.98;
    letter-spacing: 0.14em; color: #f8f2ff;
    text-shadow: 0 0 34px rgba(220, 110, 255, 0.45), 0 0 100px rgba(80, 220, 255, 0.32);
    animation: breathe 6s ease-in-out infinite;
  }
  .title h1 em { font-style: italic; color: #ffd77a; }
  .title .sub {
    margin-top: 16px; font-size: clamp(12px, 1.6vw, 16px);
    font-style: italic; letter-spacing: 0.35em; color: rgba(225, 205, 255, 0.55);
  }
  .title .rule {
    width: 64px; height: 1px; margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, rgba(220, 140, 255, 0.7), transparent);
    animation: rule-grow 1.6s ease-out 0.6s both;
  }
  .hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.22em; color: rgba(225, 205, 250, 0.45);
    text-transform: uppercase; text-align: center; z-index: 5; pointer-events: none;
    animation: fade-in 2.2s ease-out 0.8s both; white-space: nowrap;
  }
  .hint b { color: rgba(150, 240, 255, 0.9); font-weight: 400; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 24px rgba(220, 110, 255, 0.35), 0 0 80px rgba(80, 220, 255, 0.22); }
    50%      { text-shadow: 0 0 50px rgba(240, 160, 255, 0.6), 0 0 140px rgba(120, 245, 255, 0.42); }
  }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .title, .hint { animation: none; opacity: 1; }
    .title .rule { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>


<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = Math.random;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 1;

  function makeGlow(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) grad.addColorStop(o, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  const headSprites = {
    cyan: makeGlow(48, [[0,'rgba(200,255,255,1)'],[0.5,'rgba(120,240,255,0.55)'],[1,'rgba(120,240,255,0)']]),
    gold: makeGlow(48, [[0,'rgba(255,240,190,1)'],[0.5,'rgba(255,215,130,0.55)'],[1,'rgba(255,215,130,0)']]),
    violet: makeGlow(48, [[0,'rgba(255,220,255,1)'],[0.5,'rgba(210,150,255,0.55)'],[1,'rgba(210,150,255,0)']]),
  };

  let paths = [];
  let bgGrad = null;

  function build() {
    paths.length = 0;
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.45;

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0d0420');
    bgGrad.addColorStop(0.5, '#0a0318');
    bgGrad.addColorStop(1, '#06020f');

    const H30 = 30 * DEG;
    const s = (n, fn) => { const arr = []; for (let i = 0; i <= n; i++) arr.push(fn(i / n)); return arr; };

    // dikey kol (hücre ortası)
    paths.push({
      pts: s(22, t => ({ r: R * (0.06 + t * 0.9), theta: 0 })),
      color: 'rgba(150,240,255,0.9)', sprite: headSprites.cyan, delay: 0.02, width: 1.2,
    });
    // yaylar
    const radii = [0.22, 0.42, 0.62, 0.82];
    radii.forEach((rr, k) => {
      paths.push({
        pts: s(26, t => ({ r: rr * R, theta: -H30 + t * 60 * DEG })),
        color: k % 2 ? 'rgba(255,215,130,0.9)' : 'rgba(150,240,255,0.9)',
        sprite: k % 2 ? headSprites.gold : headSprites.cyan,
        delay: 0.06 + k * 0.05, width: 1.1,
      });
    });
    // dalgalı çizgi
    paths.push({
      pts: s(30, t => ({ r: R * t, theta: Math.sin(t * 9) * 0.22 })),
      color: 'rgba(220,170,255,0.9)', sprite: headSprites.violet, delay: 0.05, width: 1.1,
    });
    // sarmal
    paths.push({
      pts: s(44, t => ({ r: R * 0.1 + t * R * 0.8, theta: -0.55 + t * 1.1 })),
      color: 'rgba(255,215,130,0.9)', sprite: headSprites.gold, delay: 0.1, width: 1.1,
    });
  }

  // bir hücre yolunu sektör k'ya yansıtıp ekran koordinatına çevir
  function sectorPts(path, k, rot) {
    const base = k * Math.PI / 3;
    const mirror = k % 2 === 1;
    const out = [];
    for (const p of path.pts) {
      const th = mirror ? -p.theta : p.theta;
      const a = base + th + rot;
      out.push([cx + p.r * Math.cos(a), cy + p.r * Math.sin(a)]);
    }
    return out;
  }

  function drawSub(scr, f0, f1) {
    const n = scr.length - 1;
    const i0 = Math.max(0, Math.round(f0 * n));
    const i1 = Math.min(n, Math.round(f1 * n));
    ctx.beginPath();
    ctx.moveTo(scr[i0][0], scr[i0][1]);
    for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(scr[i][0], scr[i][1]);
    ctx.stroke();
  }

  function frame(now) {
    const t = now / 1000;
    const rot = t * 0.06;

    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // taban
    ctx.lineCap = 'round';
    for (const p of paths) {
      for (let k = 0; k < 6; k++) {
        const scr = sectorPts(p, k, rot);
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.width;
        ctx.beginPath();
        ctx.moveTo(scr[0][0], scr[0][1]);
        for (let i = 1; i < scr.length; i++) ctx.lineTo(scr[i][0], scr[i][1]);
        ctx.stroke();
      }
    }

    // aydınlatma — ışık tüm sektörlerde eşzamanlı
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of paths) {
      const head = (t * 0.22 + p.delay) % 1;
      const em = head < 0.08 ? head / 0.08 : (head > 0.92 ? (1 - head) / 0.08 : 1);
      for (let k = 0; k < 6; k++) {
        const scr = sectorPts(p, k, rot);
        ctx.globalAlpha = em;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = p.width * 2.2;
        drawSub(scr, head - 0.08, head);
        // çizim ucu
        const n = scr.length - 1;
        const fi = head * n;
        const i = Math.min(n - 1, Math.floor(fi));
        const tt = fi - i;
        const hx = scr[i][0] + (scr[i + 1][0] - scr[i][0]) * tt;
        const hy = scr[i][1] + (scr[i + 1][1] - scr[i][1]) * tt;
        ctx.globalAlpha = em;
        const hs = 8;
        ctx.drawImage(p.sprite, hx - hs, hy - hs, hs * 2, hs * 2);
      }
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (reduced) renderStatic();
  }

  function renderStatic() {
    const rot = 0.4;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    for (const p of paths) {
      for (let k = 0; k < 6; k++) {
        const scr = sectorPts(p, k, rot);
        ctx.globalAlpha = 0.6;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.width;
        ctx.beginPath();
        ctx.moveTo(scr[0][0], scr[0][1]);
        for (let i = 1; i < scr.length; i++) ctx.lineTo(scr[i][0], scr[i][1]);
        ctx.stroke();
      }
    }
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
