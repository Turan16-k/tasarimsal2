<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 18 — Ayna</title>
<meta name="theme-color" content="#04070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,2,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let cols=0,rows=0,spx=1,spy=1,gx=[],gy=[];

function build(){
  spx=Math.max(12,W/34);spy=Math.max(12,H/24);
  cols=Math.ceil(W/spx);rows=Math.ceil(H/spy);
  gx=[];gy=[];
  for(let i=0;i<=cols;i++)gx.push(i*spx);
  for(let j=0;j<=rows;j++)gy.push(j*spy);
}

function warpPoint(gx0,gy0,bx,by,bw,amp){
  const dx=gx0-bx,dy=gy0-by;
  const d2=dx*dx+dy*dy;
  const k=amp*Math.exp(-d2/(bw*bw));
  const dd=Math.sqrt(d2)||1;
  return [gx0+dx/dd*k,gy0+dy/dd*k];
}

function frame(now){
  const dt=now-last;last=now;
  const t=now/1000;
  ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);

  const bw=Math.min(W,H)*0.24;
  let bx=mx>-1e8?mx:W*0.5, by=my>-1e8?my:H*0.5;
  bx+=Math.sin(t*0.4)*7;by+=Math.cos(t*0.3)*7;
  const amp=H*(0.05+0.02*Math.sin(t*0.6))+(mx>-1e8?H*0.012:0);
  const bw2=bw*bw;

  ctx.lineWidth=1;
  // dikey çizgiler
  for(let c=0;c<=cols;c++){
    let near=1e9;
    const pts=[];
    for(let r=0;r<=rows;r++){
      const dx=gx[c]-bx,dy=gy[r]-by;
      const d2=dx*dx+dy*dy;
      if(d2<near)near=d2;
      pts.push(warpPoint(gx[c],gy[r],bx,by,bw,amp));
    }
    ctx.strokeStyle=`rgba(150,200,255,${0.035+0.17*Math.exp(-near/bw2)})`;
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let r=1;r<=rows;r++)ctx.lineTo(pts[r][0],pts[r][1]);
    ctx.stroke();
  }
  // yatay çizgiler
  for(let r=0;r<=rows;r++){
    let near=1e9;
    const pts=[];
    for(let c=0;c<=cols;c++){
      const dx=gx[c]-bx,dy=gy[r]-by;
      const d2=dx*dx+dy*dy;
      if(d2<near)near=d2;
      pts.push(warpPoint(gx[c],gy[r],bx,by,bw,amp));
    }
    ctx.strokeStyle=`rgba(150,200,255,${0.035+0.17*Math.exp(-near/bw2)})`;
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let c=1;c<=cols;c++)ctx.lineTo(pts[c][0],pts[c][1]);
    ctx.stroke();
  }

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(150,200,255,0.08)';
  ctx.lineWidth=1;
  for(let c=0;c<=cols;c++){
    ctx.beginPath();ctx.moveTo(gx[c],0);ctx.lineTo(gx[c],H);ctx.stroke();
  }
  for(let r=0;r<=rows;r++){
    ctx.beginPath();ctx.moveTo(0,gy[r]);ctx.lineTo(W,gy[r]);ctx.stroke();
  }
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
