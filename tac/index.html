<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kombinasyon 10 — Taç</title>
<meta name="theme-color" content="#06060f">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#06060f;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(1,1,5,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1,cx=0,cy=0,R=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

let pts=[],bolts=[],disT=1;
function build(){
  cx=W/2;cy=H/2;R=Math.min(W,H)*0.36;
  pts=[];bolts=[];disT=1;
  const n=18;
  for(let i=0;i<n;i++){
    pts.push({
      ang:i/n*TAU+rand()*0.1,
      r:R*(0.78+rand()*0.44),
      spd:0.06+rand()*0.1,
      hue:225+rand()*40,
    });
  }
}
function boltXY(p){return [cx+Math.cos(p.ang)*p.r,cy+Math.sin(p.ang)*p.r];}
function makeBolt(a,b){
  const pa=boltXY(a),pb=boltXY(b);
  const segs=[];
  const n=6;
  let px=pa[0],py=pa[1];
  segs.push([px,py]);
  for(let i=1;i<n;i++){
    const u=i/n;
    const bx=pa[0]+(pb[0]-pa[0])*u+(rand()-0.5)*18;
    const by=pa[1]+(pb[1]-pa[1])*u+(rand()-0.5)*18;
    segs.push([bx,by]);
  }
  segs.push(pb);
  return {segs,age:0,dur:0.28};
}

function frame(now){
  const dt=Math.min(now-last,50);last=now;
  const k=dt/16.67;
  const t=now/1000;
  ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);

  // yörünge + hafif itişme
  for(const p of pts){
    p.ang+=p.spd*k*0.016;
  }
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j];
      const ax=boltXY(a),bx=boltXY(b);
      const dx=bx[0]-ax[0],dy=bx[1]-ax[1];
      const d=Math.hypot(dx,dy);
      if(d<34&&d>0.01){
        const push=(34-d)/2;
        a.r-=dx/d*push*0.02;
        b.r+=dx/d*push*0.02;
      }
    }
  }

  // deşarj
  disT-=dt/1000;
  if(disT<=0){
    disT=0.45+rand()*0.5;
    const a=pts[(rand()*pts.length)|0];
    let best=null,bd=1e9;
    for(const c of pts){
      if(c===a)continue;
      const d=Math.hypot(boltXY(c)[0]-boltXY(a)[0],boltXY(c)[1]-boltXY(a)[1]);
      if(d<bd){bd=d;best=c;}
    }
    if(best&&bd<140){bolts.push(makeBolt(a,best));a._f=1;best._f=1;}
  }

  ctx.save();ctx.globalCompositeOperation='lighter';
  // merkez ışıma
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.5);
  gr.addColorStop(0,'rgba(190,205,255,0.16)');
  gr.addColorStop(1,'rgba(190,205,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-R*0.5,cy-R*0.5,R,R);

  // deşarj kıvılcımları
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.age+=dt/1000;
    const A=1-b.age/b.dur;
    if(A<=0){bolts.splice(i,1);continue;}
    ctx.strokeStyle=`hsla(225,80%,80%,${A})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.segs[0][0],b.segs[0][1]);
    for(let s=1;s<b.segs.length;s++)ctx.lineTo(b.segs[s][0],b.segs[s][1]);
    ctx.stroke();
  }

  // noktalar
  for(const p of pts){
    const xy=boltXY(p);
    const tw=1+0.2*Math.sin(t*2+p.ang);
    ctx.fillStyle=`hsla(${p.hue},65%,${66+(p._f?18:0)}%,${0.6*tw})`;
    ctx.beginPath();ctx.arc(xy[0],xy[1],1.5+(p._f?0.8:0),0,TAU);ctx.fill();
    if(p._f)p._f*=0.9;
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of pts){
    const xy=boltXY(p);
    ctx.fillStyle=`hsla(${p.hue},65%,64%,0.5)`;
    ctx.beginPath();ctx.arc(xy[0],xy[1],1.4,0,TAU);ctx.fill();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
