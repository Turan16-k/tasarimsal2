<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Solid — Telkari İkosahedron</title>
<meta name="theme-color" content="#050208">
<style>
  /* ─────────────────────────────────────────────────────────────
     WIREFRAME SOLID — çizgi atölyesi 02
     Tamamen bağımsız (CDN yok). Canvas2D.
     Dönen ikosahedron; bir ışık, kenarları sırayla gezerek çizer.
     ───────────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #04010a;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; display: block; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(3, 0, 10, 0.6) 100%);
  }

  .title {
    position: fixed; top: 8%; left: 50%;
    transform: translateX(-50%);
    text-align: center; color: #f0ecff; pointer-events: none; z-index: 5;
    animation: fade-in 2.4s ease-out both;
  }
  .title .kicker {
    font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(190, 170, 255, 0.6); margin-bottom: 20px; text-indent: 0.5em;
  }
  .title h1 {
    font-size: clamp(30px, 7vw, 82px); font-weight: 400; line-height: 0.98;
    letter-spacing: 0.14em; color: #f5f2ff;
    text-shadow: 0 0 34px rgba(170, 120, 255, 0.45), 0 0 100px rgba(90, 220, 255, 0.3);
    animation: breathe 8s ease-in-out infinite;
  }
  .title h1 em { font-style: italic; color: #b3eaff; }
  .title .sub {
    margin-top: 16px; font-size: clamp(12px, 1.6vw, 16px);
    font-style: italic; letter-spacing: 0.35em; color: rgba(215, 210, 255, 0.55);
  }
  .title .rule {
    width: 64px; height: 1px; margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, rgba(180, 150, 255, 0.7), transparent);
    animation: rule-grow 1.6s ease-out 0.6s both;
  }
  .hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.22em; color: rgba(215, 205, 250, 0.45);
    text-transform: uppercase; text-align: center; z-index: 5; pointer-events: none;
    animation: fade-in 2.2s ease-out 0.8s both; white-space: nowrap;
  }
  .hint b { color: rgba(140, 235, 255, 0.9); font-weight: 400; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 24px rgba(170, 120, 255, 0.35), 0 0 80px rgba(90, 220, 255, 0.2); }
    50%      { text-shadow: 0 0 50px rgba(200, 160, 255, 0.6), 0 0 140px rgba(120, 240, 255, 0.4); }
  }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .title, .hint { animation: none; opacity: 1; }
    .title .rule { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>
  <div class="vignette" aria-hidden="true"></div>


<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 1;

  function makeGlow(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) grad.addColorStop(o, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  const vtxGlow = makeGlow(48, [
    [0, 'rgba(210,235,255,1)'],
    [0.5, 'rgba(150,190,255,0.5)'],
    [1, 'rgba(150,190,255,0)'],
  ]);
  const headGlow = makeGlow(48, [
    [0, 'rgba(255,255,255,1)'],
    [0.5, 'rgba(150,240,255,0.55)'],
    [1, 'rgba(150,240,255,0)'],
  ]);
  const aura = makeGlow(256, [
    [0, 'rgba(140,90,255,0.5)'],
    [1, 'rgba(140,90,255,0)'],
  ]);

  // standart ikosahedron köşeleri (birim küreye normalleştirilir)
  const phi = (1 + Math.sqrt(5)) / 2;
  const rawV = [
    [ 0,  1,  phi], [ 0, -1,  phi], [ 0,  1, -phi], [ 0, -1, -phi],
    [ 1,  phi, 0], [-1,  phi, 0], [ 1, -phi, 0], [-1, -phi, 0],
    [ phi, 0,  1], [-phi, 0,  1], [ phi, 0, -1], [-phi, 0, -1],
  ];
  const V = rawV.map(v => {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  });
  // kenarlar: birim kürede birbirine yakın köşeler
  const edges = [];
  for (let i = 0; i < V.length; i++) {
    for (let j = i + 1; j < V.length; j++) {
      const d = Math.hypot(V[i][0] - V[j][0], V[i][1] - V[j][1], V[i][2] - V[j][2]);
      if (d < 1.1) edges.push([i, j]);
    }
  }

  let bgGrad = null;

  function project(v, rx, ry) {
    const cx_ = Math.cos(ry), sx_ = Math.sin(ry);
    const x1 = v[0] * cx_ + v[2] * sx_;
    const z1 = -v[0] * sx_ + v[2] * cx_;
    const cxx = Math.cos(rx), sxx = Math.sin(rx);
    const y2 = v[1] * cxx - z1 * sxx;
    const z2 = v[1] * sxx + z1 * cxx;
    const f = 4;
    const s = f / (f + z2);
    return {
      x: cx + x1 * s * R,
      y: cy - y2 * s * R,
      s: s,
    };
  }

  function build() {
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.38;
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0520');
    bgGrad.addColorStop(0.5, '#060313');
    bgGrad.addColorStop(1, '#04010a');
  }

  function frame(now) {
    const t = now / 1000;
    const rx = t * 0.32;
    const ry = t * 0.47;

    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // arka plan aurasi
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(aura, cx - R * 2, cy - R * 2, R * 4, R * 4);
    ctx.restore();

    const P = V.map(v => project(v, rx, ry));

    // dekoratif yörünge çemberi (izdüşümlenmiş)
    const ringPts = [];
    for (let i = 0; i <= 72; i++) {
      const a = (i / 72) * TAU;
      ringPts.push(project([Math.cos(a) * 1.06, Math.sin(a) * 0.0, Math.sin(a) * 1.06], rx, ry));
    }

    // taban çizgiler (sönük)
    ctx.lineCap = 'round';
    for (const [a, b] of edges) {
      ctx.strokeStyle = 'rgba(150,140,220,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(P[a].x, P[a].y);
      ctx.lineTo(P[b].x, P[b].y);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(150,140,220,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ringPts[0].x, ringPts[0].y);
    for (let i = 1; i < ringPts.length; i++) ctx.lineTo(ringPts[i].x, ringPts[i].y);
    ctx.stroke();

    // gezinen ışık — kenarları sırayla çizer
    const E = edges.length;
    const pos = (t * 0.22 * E) % E;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < E; i++) {
      const behind = pos - i;
      if (behind <= 0) continue;
      const [a, b] = edges[i];
      let f1 = 1;
      if (behind < 1) f1 = behind; // ışık bu kenarın ortasındayken
      const alpha = 0.9 * Math.min(1, behind * 2) * Math.exp(-behind * 0.5);
      const pxa = P[a].x, pya = P[a].y;
      const ex = P[b].x - pxa, ey = P[b].y - pya;
      ctx.strokeStyle = 'rgba(220,245,255,1)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(pxa, pya);
      ctx.lineTo(pxa + ex * f1, pya + ey * f1);
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.stroke();
    }
    // aktif kenarın ucu
    const ai = Math.floor(pos);
    if (ai >= 0 && ai < E) {
      const frac = pos - ai;
      const [a, b] = edges[ai];
      const hx = P[a].x + (P[b].x - P[a].x) * frac;
      const hy = P[a].y + (P[b].y - P[a].y) * frac;
      ctx.globalAlpha = 1;
      ctx.drawImage(headGlow, hx - 10, hy - 10, 20, 20);
    }
    // köşe parıltıları
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const rr = 3 + p.s * 3;
      ctx.globalAlpha = 0.5 + p.s * 0.5;
      ctx.drawImage(vtxGlow, p.x - rr, p.y - rr, rr * 2, rr * 2);
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    if (reduced) renderStatic();
  }

  function renderStatic() {
    const t = 0.8;
    const rx = t * 0.32, ry = t * 0.47;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    const P = V.map(v => project(v, rx, ry));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [a, b] of edges) {
      ctx.strokeStyle = 'rgba(160,180,255,0.7)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(P[a].x, P[a].y);
      ctx.lineTo(P[b].x, P[b].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
