<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 05 — Kuğu</title>
<meta name="theme-color" content="#05070c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070c;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(1,3,7,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

function makeGlow(size,stops){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const[o,col]of stops)gr.addColorStop(o,col);
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  return c;
}
const glow=makeGlow(48,[[0,'rgba(240,250,255,1)'],[0.5,'rgba(200,232,255,0.5)'],[1,'rgba(200,232,255,0)']]);

let cx=0,wl=0,anchors=[],ripples=[],lastPush=0;

function crsmooth(pts,segs){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    for(let j=0;j<segs;j++){
      const t=j/segs,t2=t*t,t3=t2*t;
      const x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      out.push([x,y]);
    }
  }
  out.push([pts[pts.length-1][0],pts[pts.length-1][1]]);
  return out;
}

function build(){
  cx=W/2;wl=H*0.62;
  anchors=[
    [cx-W*0.16,wl],
    [cx-W*0.11,wl-H*0.26],
    [cx-W*0.055,wl-H*0.31],
    [cx-W*0.02,wl-H*0.25],
    [cx+W*0.03,wl-H*0.12],
    [cx+W*0.12,wl-H*0.04],
    [cx+W*0.17,wl],
  ];
  ripples.length=0;
  ripples.push({x:cx-W*0.16,y:wl,age:0,life:10000,r:0});
  ripples.push({x:cx+W*0.17,y:wl,age:0,life:13000,r:0});
}

function frame(now){
  const dt=now-last;last=now;
  const k=Math.min(dt,50)/16.67;
  const t=now/1000;

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#05070c');
  bg.addColorStop(wl/H,'#08131c');
  bg.addColorStop(1,'#04070b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // su yüzeyi
  ctx.strokeStyle='rgba(140,190,230,0.10)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,wl);ctx.lineTo(W,wl);ctx.stroke();

  // kuğu — nefes + başın farenin yönüne uzanması
  const sway=Math.sin(t*0.5)*4;
  const headLean=mx>-1e8?Math.max(-W*0.03,Math.min(W*0.03,(mx-cx)*0.25)):0;
  const moved=anchors.map((a,i)=>{
    const neck=Math.exp(-Math.pow((i-2)/3,2));
    return [a[0]+headLean*neck,a[1]-sway*neck];
  });
  const upper=crsmooth(moved,10);

  const grad=ctx.createLinearGradient(upper[0][0],upper[0][1],upper[upper.length-1][0],upper[upper.length-1][1]);
  grad.addColorStop(0,'rgba(200,230,255,0.10)');
  grad.addColorStop(0.5,'rgba(240,250,255,0.78)');
  grad.addColorStop(1,'rgba(200,230,255,0.10)');
  ctx.strokeStyle=grad;ctx.lineWidth=1.4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(upper[0][0],upper[0][1]);
  for(let i=1;i<upper.length;i++)ctx.lineTo(upper[i][0],upper[i][1]);
  ctx.stroke();

  // gezen parıltı
  const hd=(t*0.05)%1;
  const iH=Math.floor(hd*(upper.length-1));
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.3+0.25*Math.sin(t*1.5);
  ctx.drawImage(glow,upper[iH][0]-8,upper[iH][1]-8,16,16);
  ctx.restore();

  // yansıma — soluk, dalgalı
  const ref=crsmooth(anchors.map(a=>[a[0],wl+(wl-a[1])]),10);
  ctx.strokeStyle='rgba(170,210,240,0.16)';
  ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(ref[0][0],ref[0][1]);
  for(let i=1;i<ref.length;i++){
    ctx.lineTo(ref[i][0],ref[i][1]+Math.sin(ref[i][0]*0.03+t*0.8)*2);
  }
  ctx.stroke();

  // su halkaları
  ctx.save();ctx.strokeStyle='rgba(190,225,255,0.5)';
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];rp.age+=dt;
    const p=rp.age/rp.life;
    if(p>=1){ripples.splice(i,1);continue;}
    const rr=3+p*(W*0.14);
    ctx.globalAlpha=(1-p)*0.22;
    ctx.beginPath();ctx.ellipse(rp.x,rp.y,rr,rr*0.13,0,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();

  // dokununca halka
  if(mx>-1e8&&now-lastPush>160&&Math.abs(my-wl)<H*0.3){
    lastPush=now;
    if(ripples.length<14)ripples.push({x:mx,y:my,age:0,life:5000,r:0});
  }

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}

function renderStatic(){
  const t=2;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#05070c');bg.addColorStop(wl/H,'#08131c');bg.addColorStop(1,'#04070b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const upper=crsmooth(anchors,10);
  ctx.strokeStyle='rgba(240,250,255,0.7)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(upper[0][0],upper[0][1]);
  for(let i=1;i<upper.length;i++)ctx.lineTo(upper[i][0],upper[i][1]);
  ctx.stroke();
  const ref=crsmooth(anchors.map(a=>[a[0],wl+(wl-a[1])]),10);
  ctx.strokeStyle='rgba(170,210,240,0.16)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(ref[0][0],ref[0][1]);
  for(let i=1;i<ref.length;i++)ctx.lineTo(ref[i][0],ref[i][1]);
  ctx.stroke();
}

window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
