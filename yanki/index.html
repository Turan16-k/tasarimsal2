<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anımsama 15 — Yankı</title>
<meta name="theme-color" content="#030609">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#030609;overflow:hidden}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,1,4,0.5) 100%)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=Math.random;
let W=0,H=0,DPR=1;
let mx=-1e9,my=-1e9;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',()=>{mx=-1e9;my=-1e9;});

function makeGlow(size,stops){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const[o,col]of stops)gr.addColorStop(o,col);
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  return c;
}
const soft=makeGlow(256,[[0,'rgba(190,220,255,0.8)'],[0.5,'rgba(140,190,255,0.25)'],[1,'rgba(140,190,255,0)']]);

let rings=[],lastPush=0,ambientT=0;

function build(){rings.length=0;ambientT=0;lastPush=0;}

function frame(now){
  const dt=now-last;last=now;
  const t=now/1000;
  ctx.fillStyle='#030609';ctx.fillRect(0,0,W,H);

  // hafif ortam ışığı
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.12;
  ctx.drawImage(soft,W/2-Math.min(W,H),H/2-Math.min(W,H),Math.min(W,H)*2,Math.min(W,H)*2);
  ctx.restore();

  // yankı halkaları
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=rings.length-1;i>=0;i--){
    const rp=rings[i];rp.age+=dt;
    const p=rp.age/rp.life;
    if(p>=1){rings.splice(i,1);continue;}
    const r=6+p*(Math.max(W,H)*0.62);
    const al=Math.pow(1-p,1.8)*0.30;
    ctx.globalAlpha=al;
    ctx.strokeStyle='rgba(190,220,255,0.9)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(rp.x,rp.y,r,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();

  // dokununca
  if(mx>-1e8&&now-lastPush>90){
    lastPush=now;
    if(rings.length<48)rings.push({x:mx,y:my,age:0,life:3800+rand()*1400});
  }
  // sessizlikte yalnız yankılar
  ambientT+=dt;
  if(ambientT>3200+rand()*3000){ambientT=0;rings.push({x:rand()*W,y:rand()*H,age:0,life:4200});}

  requestAnimationFrame(frame);
}
let last=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
  if(reduced)renderStatic();
}
function renderStatic(){
  ctx.fillStyle='#030609';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(190,220,255,0.25)';
  ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    ctx.beginPath();ctx.arc(W*0.5,H*0.5,30+i*(Math.max(W,H)*0.5/6),0,TAU);ctx.stroke();
  }
  ctx.restore();
}
window.addEventListener('resize',resize);
resize();
if(!reduced)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
